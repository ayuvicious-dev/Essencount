/* nama file bank: ESTATEMENT_<no rekening>_<TAHUN><BULAN>.pdf -> kenali bulan & tahunnya */
function esNameYm(n){
  const m=/_(20\d{2})(0[1-9]|1[0-2])(?=$|[^0-9])/.exec(String(n).replace(/\.pdf$/i,''));
  return m?m[1]+'-'+m[2]:'';
}
async function onEsFile(inp){
  const fl=[...(inp.files||[])];inp.value='';
  if(!fl.length)return;
  const sel=esYm(),sc=esScope();let ok=0,bad=0,last='';
  for(const f of fl){
    try{
      if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){bad++;continue}
      if(f.size>ES_MAX){bad++;continue}
      const buf=await f.arrayBuffer();
      const head=new TextDecoder('latin1').decode(new Uint8Array(buf,0,Math.min(1024,buf.byteLength)));
      if(head.indexOf('%PDF')<0){bad++;continue}
      const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      const ym=esNameYm(f.name)||sel;
      await esPut({k:sc+'|'+ym+'|'+id,scope:sc,ym,id,name:f.name,size:f.size,t:Date.now(),data:buf});
      ok++;last=ym;
    }catch(e){console.error(e);bad++}
  }
  if(last){const s=esSt();s.esY=+last.slice(0,4);s.esM=+last.slice(5,7)}
  esLoad();
  toast(ok?(ok+' e-statement diunggah ke '+ES_MON[+last.slice(5,7)-1]+' '+last.slice(0,4)+(bad?', '+bad+' file dilewati':'')):'File tidak valid. Pilih file PDF (maks. 30 MB).');
}
/* muat pustaka penggabung PDF saat dibutuhkan */
const PDFLIB_URLS=['https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js','https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js'];
function loadPdfLib(){
  if(window.PDFLib&&window.PDFLib.PDFDocument)return Promise.resolve(window.PDFLib);
  if(loadPdfLib.p)return loadPdfLib.p;
  const one=u=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=u;sc.async=true;
    sc.onload=()=>window.PDFLib&&window.PDFLib.PDFDocument?ok(window.PDFLib):no(new Error('pdf-lib tidak tersedia'));
    sc.onerror=()=>{sc.remove();no(new Error('gagal memuat '+u))};document.head.appendChild(sc)});
  loadPdfLib.p=one(PDFLIB_URLS[0]).catch(()=>one(PDFLIB_URLS[1])).catch(e=>{loadPdfLib.p=null;throw e});
  return loadPdfLib.p;
}
/* pdf.js: membaca PDF apa pun (berpassword, terenkripsi, struktur tidak standar) lalu dirender ke gambar */
const PDFJS_BASE='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadPdfJs(){
  if(loadPdfJs.p)return loadPdfJs.p;
  loadPdfJs.p=new Promise((ok,no)=>{
    if(window.pdfjsLib&&window.pdfjsLib.getDocument)return ok(window.pdfjsLib);
    const sc=document.createElement('script');sc.src=PDFJS_BASE+'pdf.min.js';sc.async=true;
    sc.onload=()=>window.pdfjsLib?ok(window.pdfjsLib):no(new Error('pdf.js tidak tersedia'));
    sc.onerror=()=>{sc.remove();no(new Error('gagal memuat pdf.js'))};document.head.appendChild(sc);
  }).then(async L=>{
    try{const r=await fetch(PDFJS_BASE+'pdf.worker.min.js');const b=await r.blob();L.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b)}
    catch(e){L.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.js'}
    return L;
  }).catch(e=>{loadPdfJs.p=null;throw e});
  return loadPdfJs.p;
}
/* render semua halaman PDF jadi dokumen pdf-lib baru (ukuran halaman asli dipertahankan) */
async function esRasterize(PL,rec){
  const L=await loadPdfJs();
  let pdf=null,pw=undefined;
  for(let tries=0;tries<4&&!pdf;tries++){
    const task=L.getDocument({data:new Uint8Array(rec.data.slice(0)),password:pw,isEvalSupported:false});
    try{pdf=await task.promise}
    catch(e){
      try{task.destroy()}catch(_){}
      if(e&&e.name==='PasswordException'){
        const v=window.prompt((e.code===2?'Password salah.\n':'')+'E-statement "'+rec.name+'" dilindungi password.\nMasukkan password agar bisa dilampirkan (Batal = lewati file ini):','');
        if(v===null)throw new Error('password tidak diisi');
        pw=v;
      }else throw e;
    }
  }
  if(!pdf)throw new Error('password salah');
  const out=await PL.PDFDocument.create();
  try{
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const v1=page.getViewport({scale:1});
      const sc=Math.min(2,2200/Math.max(v1.width,v1.height));
      const vp=page.getViewport({scale:sc});
      const cv=document.createElement('canvas');cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
      const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
      await page.render({canvasContext:ctx,viewport:vp}).promise;
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
      const img=await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
      const pp=out.addPage([v1.width,v1.height]);
      pp.drawImage(img,{x:0,y:0,width:v1.width,height:v1.height});
      cv.width=cv.height=0;page.cleanup();
    }
  }finally{try{await pdf.destroy()}catch(_){}}
  return out;
}

/* perkecil foto: sisi terpanjang maks. 1600 px, JPEG; kembalikan juga thumbnail kecil */
function buShrink(file){
  return new Promise((ok,no)=>{
    const u=URL.createObjectURL(file),img=new Image();
    img.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Foto tidak dapat dibuka'))};
    img.onload=()=>{
      try{
        const W=img.naturalWidth,H=img.naturalHeight;
        if(!W||!H)throw new Error('Foto kosong');
        const draw=mx=>{const k=Math.min(1,mx/Math.max(W,H)),w=Math.max(1,Math.round(W*k)),h=Math.max(1,Math.round(H*k));
          const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);return c};
        const big=draw(1600),th=draw(72).toDataURL('image/jpeg',.6);
        big.toBlob(b=>{URL.revokeObjectURL(u);if(!b)return no(new Error('Gagal memproses foto'));
          b.arrayBuffer().then(buf=>ok({buf,w:big.width,h:big.height,th,size:b.size})).catch(no)},'image/jpeg',.82);
      }catch(e){URL.revokeObjectURL(u);no(e)}
    };
    img.src=u;
  });
}

function readCoverImg(file){
  return new Promise((res,rej)=>{
    if(!/^image\/(png|jpeg|webp)$/.test(file.type))return rej(new Error('Pilih file PNG, JPG, atau WebP.'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Gagal membaca file.'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('File gambar tidak dapat dibuka.'));
      img.onload=()=>{
        let out='';
        for(const [mx,q] of [[1400,.82],[1100,.75],[900,.7]]){
          const k=Math.min(1,mx/Math.max(img.width,img.height,1)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
          const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
          x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
          out=c.toDataURL('image/jpeg',q);if(out.length<=500000)break;
        }
        out.length>650000?rej(new Error('Gambar terlalu besar. Pilih gambar lain.')):res(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function onCoverFile(inp){
  const file=inp.files&&inp.files[0];inp.value='';if(!file)return;
  try{const c=cvGet();c.img=await readCoverImg(file);cvSave();cvRerender();toast('Gambar cover dimuat')}
  catch(e){toast(e.message||'Gagal memuat gambar.')}
}
function cvBgData(c){
  return new Promise(res=>{
    if(!c.img)return res(null);
    const im=new Image();
    im.onload=()=>{
      const W=1240,H=1754,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,W,H);
      const iw=im.naturalWidth||1,ih=im.naturalHeight||1,k=c.fit==='fit'?Math.min(W/iw,H/ih):Math.max(W/iw,H/ih),w=iw*k,h=ih*k;
      x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
      res({data:cv.toDataURL('image/jpeg',.88),fmt:'JPEG'});
    };
    im.onerror=()=>res(null);im.src=c.img;
  });
}

function rcProdRun(){
  const rid=S.rcEdit;
  const r=rid&&rid!=='new'?S.recipes.find(x=>x.id===rid):null;
  if(!r)return toast('Simpan resep terlebih dahulu.');
  const q=parseFloat(($('#rcProdQty')||{}).value)||0;
  if(!(q>0))return toast('Isi Qty lebih dari 0.');
  const portions=+r.portions>0?+r.portions:1;
  const ings=(r.ings||[]).filter(x=>x.id);
  if(!ings.length)return toast('Resep belum punya bahan.');
  const use=[];
  for(const x of ings){
    const it=x.t==='s'?rcProdItem(x.id):S.items.find(i=>i.id===x.id);
    if(!it)return toast(x.t==='s'?`Sub-resep ${x.name||''} belum ada di Persediaan. Tambahkan dulu ke persediaan.`:`Bahan ${x.name||''} tidak ditemukan di Persediaan.`);
    const need=(+x.qty||0)/portions*q;
    if(need>(+it.qty||0)+1e-9)return toast(`Stok ${it.name} kurang (butuh ${+need.toFixed(2)}, ada ${+(+it.qty||0).toFixed(2)} ${it.unit||''}).`);
    use.push({it,need,val:Math.round(need*(+it.cost||0))});
  }
  const value=use.reduce((a,u)=>a+u.val,0);
  const ex=rcProdItem(r.id);
  const prodAcc=(ex&&(ex.invAcc||opnAcc(ex).inv))||opnAcc(use[0].it).inv;
  const ops=[];
  use.forEach(u=>{if(u.need>0)ops.push({t:'inc',col:'items',id:u.it.id,field:'qty',by:-u.need})});
  if(ex){
    const oq=+ex.qty||0,nc=Math.round(((oq*(+ex.cost||0)+value)/(oq+q))*100)/100;
    ops.push({t:'set',col:'items',id:ex.id,data:{cost:nc,recipeId:r.id,unit:ex.unit||'porsi'}},{t:'inc',col:'items',id:ex.id,field:'qty',by:q});
  }else{
    ops.push({t:'add',col:'items',id:'rc_'+r.id,data:{name:r.name,sku:'',unit:'porsi',qty:q,min:0,cost:Math.round(value/q*100)/100,price:0,recipeId:r.id,klas:'Persediaan Barang',invAcc:prodAcc||'',ts:Date.now()}});
  }
  const cr={};
  use.forEach(u=>{const a=u.it.invAcc||opnAcc(u.it).inv;if(a&&a!==prodAcc&&u.val>0)cr[a]=(cr[a]||0)+u.val});
  const tot=Object.values(cr).reduce((a,b)=>a+b,0);
  if(tot>0&&prodAcc){
    ops.push({t:'add',col:'journals',data:{kind:'general',date:today(),desc:`Produksi sub-resep ${r.name} (${+q.toFixed(2)} porsi)`,lines:[{acc:prodAcc,side:'D',amt:tot},...Object.entries(cr).map(([acc,amt])=>({acc,side:'K',amt}))],amount:tot,no:jNextNo(),ts:Date.now()}});
  }
  const nm=r.name,rid2=r.id;
  confirmSheet(`Tambah ${+q.toFixed(2)} porsi ${nm} ke Persediaan? Bahan terkait akan berkurang.`,'Tambah',()=>{
    commit(ops);toast('Sub-resep ditambahkan ke Persediaan');
    const b=$('#rcProdQty');if(b)b.value='';
    setTimeout(()=>{const c=$('#rcProdStock'),it=rcProdItem(rid2);if(c&&it)c.textContent=+(+it.qty||0).toFixed(2)+' porsi'},700);
  });
}

function mnKonsumsiAcc(){

  const f=A.find(a=>/konsumsi/i.test(a.name)&&String(a.cat||'').toUpperCase()==='BO')||A.find(a=>/konsumsi/i.test(a.name));

function mnCharge(slot){
  const date=mnDate(),label=(MN_SLOTS.find(s=>s[0]===slot)||[])[1]||'Menu';
  const L=S.menus.filter(m=>m.date===date&&m.slot===slot&&!m.charged);
  const sel=L.filter(m=>m.done);
  if(!L.length)return toast('Belum ada menu yang bisa dibebankan.');
  if(!sel.length)return toast('Centang menu yang sudah dimasak terlebih dahulu.');
  const need=new Map(),add=(it,q)=>need.set(it.id,(need.get(it.id)||0)+q);
  for(const m of sel){
    const x=mnRef(m);if(!x)return toast('Ada menu yang produk/resepnya sudah dihapus. Hapus dari daftar dulu.');
    const q=+m.qty||0;if(!(q>0))return toast('Isi qty lebih dari 0 untuk '+(x.name||'menu')+'.');
    if(m.kind==='b'){add(x,q);continue}
    const portions=+x.portions>0?+x.portions:1,ings=(x.ings||[]).filter(g=>g.id);
    if(!ings.length)return toast('Resep '+(x.name||'')+' belum punya bahan.');
    for(const g of ings){
      const it=g.t==='s'?rcProdItem(g.id):S.items.find(i=>i.id===g.id);
      if(!it)return toast(g.t==='s'?`Sub-resep ${g.name||''} belum ada di Persediaan. Tambahkan dulu ke persediaan.`:`Bahan ${g.name||''} tidak ditemukan di Persediaan.`);
      add(it,(+g.qty||0)/portions*q);
    }
  }
  const use=[];let total=0;
  for(const [id,q] of need){
    const it=S.items.find(i=>i.id===id);
    if(q>(+it.qty||0)+1e-9)return toast(`Stok ${it.name} kurang (butuh ${+q.toFixed(2)}, ada ${+(+it.qty||0).toFixed(2)} ${it.unit||''}).`);
    const acc=it.invAcc||opnAcc(it).inv;if(!acc)return toast('Akun persediaan untuk '+it.name+' belum ditemukan di COA.');
    const val=Math.round(q*(+it.cost||0));use.push({it,q,acc,val});total+=val;
  }
  const kon=mnKonsumsiAcc();
  const names=sel.map(m=>(mnRef(m)||{}).name||m.name).join(', ');
  confirmSheet(`Bebankan ${sel.length} menu ${label.toLowerCase()}? Persediaan berkurang ${rp(total)} dan dipindahkan ke ${kon.name}.`,'Bebankan',()=>{
    const ops=[...kon.ops];
    use.forEach(u=>{if(u.q>0)ops.push({t:'inc',col:'items',id:u.it.id,field:'qty',by:-u.q})});
    let jid='';
    if(total>0){
      const cr={};use.forEach(u=>{if(u.val>0)cr[u.acc]=(cr[u.acc]||0)+u.val});
      jid=S.demo?('d'+Math.random().toString(36).slice(2,9)):S.fb.fs.doc(S.fb.fs.collection(S.fb.db,...wsBase(),'journals')).id;
      const jd=date>today()?today():date;
      ops.push({t:'add',col:'journals',id:jid,data:{kind:'general',date:jd,desc:(`Konsumsi ${label.toLowerCase()} ${dmy(date)}: ${names}`).slice(0,120),lines:[{acc:kon.code,side:'D',amt:total},...Object.entries(cr).map(([acc,amt])=>({acc,side:'K',amt}))],amount:total,no:jNextNo(),ts:Date.now()}});
    }
    sel.forEach(m=>ops.push({t:'set',col:'menus',id:m.id,data:{charged:true,chargedAt:Date.now(),jid}}));
    commit(ops);toast('Menu dibebankan ke '+kon.name);
  });
}

/* ---------- Sheet, toast ---------- */
function openSheet(title,body,stack){
  if(stack&&S.sheet&&!S.sheetBelow){S.sheetBelow=S.sheet;S.sheet=null}
  else{if(S.sheetBelow){S.sheetBelow.remove();S.sheetBelow=null}
  if(S.sheet){S.sheet.remove();S.sheet=null}}
  const el=document.createElement('div');el.className='sheet-wrap';
  el.innerHTML=`<div class="scrim" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-grip"></div><div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="close-sheet" aria-label="Tutup">${ico('x',20)}</button></div>${body}</div>`;
  document.body.appendChild(el);document.body.classList.add('lock');
  requestAnimationFrame(()=>el.classList.add('open'));
  S.sheet=el;return el;
}
function closeSheet(){
  if(!S.sheet)return;const el=S.sheet;S.sheet=S.sheetBelow||null;S.sheetBelow=null;el.classList.remove('open');if(!S.sheet)document.body.classList.remove('lock');setTimeout(()=>el.remove(),230);
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function confirmSheet(msg,label,fn){
  openSheet('Konfirmasi',`<p class="muted" style="margin-bottom:18px">${esc(msg)}</p><div class="actions"><button class="btn" data-act="close-sheet">Batal</button><button class="btn danger" data-act="do-confirm">${esc(label)}</button></div>`);
  S.confirmFn=fn;
}

/* ---------- Form barang ---------- */
/* FIFO: stock opname (pengurangan) menghabiskan pembelian paling lama lebih dulu; koreksi tambah membatalkan pengurangan terakhir.
   Tiap pembelian dianggap habis pada tanggal opname yang menghabiskannya (= saat dibebankan). Stok yang tidak berasal dari pembelian dianggap stok awal (paling lama, tidak ditampilkan). */
function itemBatches(it){
  const cmp=(x,y)=>x.date<y.date?-1:x.date>y.date?1:(x.ts||0)-(y.ts||0),EPS=1e-6;
  const buys=S.journals.filter(j=>j.kind==='purchase'&&j.itemId===it.id).sort(cmp);
  const ops=S.journals.filter(j=>j.kind==='opname'&&j.itemId===it.id).sort(cmp);
  const sumP=sum(buys,j=>+j.qty||0),sumO=sum(ops,j=>(+j.qtyDelta)||0),open=Math.max(0,(it.qty||0)-sumP-sumO);
  const B=[];if(open>EPS)B.push({j:null,date:'',qty:open,rem:open,done:null});
  buys.forEach(j=>B.push({j,date:j.date||'',qty:+j.qty||0,rem:+j.qty||0,done:null}));
  const log=[];
  ops.forEach(o=>{
    let q=Math.abs(+o.qtyDelta||0);if(!(q>0))return;
    if((+o.qtyDelta)<0){
      for(const b of B){
        if(q<=EPS)break;
        if(b.rem<=EPS||b.date>o.date)continue;
        const t=Math.min(b.rem,q);b.rem-=t;q-=t;log.push({b,t});
        if(b.rem<=EPS){b.rem=0;b.done=o.date}
      }
    }else{
      while(q>EPS&&log.length){
        const e=log.pop(),g=Math.min(e.t,q);e.b.rem+=g;e.t-=g;q-=g;if(e.t>EPS)log.push(e);
        if(e.b.rem>EPS)e.b.done=null;
      }
    }
  });
  return B.filter(b=>b.j);
}

  const hist=itemBatches(it).sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:((y.j.ts||0)-(x.j.ts||0)));
  const u=it.unit?' '+esc(it.unit):'';

    :`<p class="muted" style="padding:6px 2px">Belum ada pembelian untuk barang ini.</p>`;
  openSheet(it.name||'Informasi barang',`<div>
    ${it.sku?kv('Kode',esc(it.sku)):''}${kva('inv','Akun persediaan',ac.inv)}${kva('exp','Akun beban operasional',ac.exp)}

/* ---------- Chart Of Account: impor, header & subheader ---------- */
function numCell(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  let t=String(v??'').replace(/[^\d,.\-]/g,'');if(!t)return 0;
  if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');
  const n=parseFloat(t);return isFinite(n)?n:0;
}
/* Kategori (mis. Aset Persediaan) bersifat tetap: pengelompokan = kode kategori + label kategori.
   Mengubah label sebuah akun/header memindahkan akun itu (beserta subheader-nya) ke kategori berlabel tsb, bukan mengganti nama kategori. */
const coaGrp=a=>a.cat+'|'+(a.catLabel||a.cat);
function coaTree(list){
  const sorted=[...list].sort((a,b)=>(a.ord||0)-(b.ord||0)),cats=new Map(),hdr=new Map();
  for(const a of sorted){
    const gk=coaGrp(a);
    if(!cats.has(gk))cats.set(gk,{cat:a.cat,key:gk,label:a.catLabel||a.cat,tops:[],n:0});
    cats.get(gk).n++;
    if(a.isHeader&&!hdr.has(gk+'|'+a.name))hdr.set(gk+'|'+a.name,{acc:a,subs:[]});
  }
  for(const a of sorted){

/* Kode akun yang dipakai oleh akun dengan nama berbeda */
function coaDupCodes(){
  const m=new Map();
  S.accounts.forEach(a=>{const c=String(a.code||'').trim();if(!c)return;if(!m.has(c))m.set(c,new Set());m.get(c).add(a.name)});
  return new Set([...m].filter(([,n])=>n.size>1).map(([c])=>c));
}
const coaDupBadge=a=>COA_DUP.has(String(a.code||'').trim())?'<span class="badge red" title="Kode akun ini juga dipakai akun lain dengan nama berbeda. Ubah kodenya lewat Rincian akun.">Kode ganda</span>':'';
/* Cari kode kosong terdekat dengan pola yang sama (1-1100 -> 1-1101), tidak bentrok dengan kode yang sudah ada */
function coaFreeCode(code,cat,taken){
  const m=/^(.*?)(\d+)$/.exec(String(code||'').trim());
  if(!m){let n=1,c;do c=cat+'-'+String(n++).padStart(3,'0');while(taken.has(c));return c}
  const w=m[2].length;let n=+m[2],c;
  do{n++;c=m[1]+String(n).padStart(w,'0')}while(taken.has(c));
  return c;
}
/* Akun pertama (menurut urutan COA) tetap memakai kode lama; akun lain dengan nama berbeda diberi kode baru */
function coaFixDup(){
  const dups=coaDupCodes();if(!dups.size)return toast('Tidak ada kode ganda');
  const taken=new Set(S.accounts.map(a=>String(a.code||'').trim())),ops=[],moved=[];
  [...dups].forEach(code=>{
    const L=S.accounts.filter(a=>String(a.code||'').trim()===code).sort((a,b)=>(a.ord||0)-(b.ord||0)),keep=L[0];
    L.slice(1).forEach(a=>{
      if(a.name===keep.name)return;
      const nc=coaFreeCode(code,a.cat,taken);taken.add(nc);
      ops.push({t:'set',col:'accounts',id:a.id,data:{code:nc}});moved.push({name:a.name,from:code,to:nc});
    });
  });
  if(!ops.length)return toast('Tidak ada kode ganda yang bisa diperbaiki');
  const ex=moved.slice(0,3).map(x=>x.name+' ('+x.from+' → '+x.to+')').join(', ')+(moved.length>3?' dan '+(moved.length-3)+' lainnya':'');
  confirmSheet(nf.format(moved.length)+' akun akan diberi kode baru: '+ex+'. Akun pertama tetap memakai kode lama, sehingga jurnal dan aset lama yang memakai kode itu tetap tertuju ke akun tersebut. Periksa jurnal lama bila ada yang seharusnya ke akun lain.','Perbaiki',()=>{

  });
}

function assetCellSave(inp){

  const a=S.assets.find(x=>x.id===inp.dataset.id),f=inp.dataset.f,v=inp.value.trim(),back=m=>{if(m)toast(m);refreshAssetList()};
  if(!a||inp.dataset.cancel)return back();

    if(v===a.name)return back();data={name:v};
  }else if(f==='type'){

  }else if(f==='date'){

/* Sinkronkan rename/ubah kode akun ke seluruh histori: referensi kode di jurnal, aset, barang, pending impor,
   serta teks keterangan otomatis ("Impor: debit / kredit", "Biaya <nama akun>") yang menyimpan nama akun lama. */
function coaRenameOps(a,newName,newCode){
  const ops=[],oldName=a.name,oldCode=a.code,codeCh=newCode!==oldCode,nameCh=newName!==oldName;
  if(a.isHeader||(!codeCh&&!nameCh))return ops;
  const mv=c=>c===oldCode?newCode:c;
  S.journals.forEach(j=>{
    const d={};
    if(codeCh){
      ['debitAcc','creditAcc','prepaidAcc'].forEach(k=>{if(j[k]===oldCode)d[k]=newCode});
      if(Array.isArray(j.lines)&&j.lines.some(l=>l&&l.acc===oldCode))d.lines=j.lines.map(l=>l&&l.acc===oldCode?{...l,acc:newCode}:l);
    }
    if(nameCh&&typeof j.desc==='string'){
      const m=/^Impor: (.*) \/ (.*)$/.exec(j.desc);
      if(m&&(m[1]===oldName||m[2]===oldName))d.desc=('Impor: '+(m[1]===oldName?newName:m[1])+' / '+(m[2]===oldName?newName:m[2])).slice(0,120);
      else if(j.kind==='expense'&&j.desc==='Biaya '+oldName)d.desc='Biaya '+newName;
    }
    if(Object.keys(d).length)ops.push({t:'set',col:'journals',id:j.id,data:d});
  });
  if(codeCh){
    S.assets.forEach(x=>{const d={};['fixedAcc','creditAcc','accumAcc','expAcc'].forEach(k=>{if(x[k]===oldCode)d[k]=newCode});if(Object.keys(d).length)ops.push({t:'set',col:'assets',id:x.id,data:d})});
    S.items.forEach(x=>{const d={};['invAcc','expAcc'].forEach(k=>{if(x[k]===oldCode)d[k]=newCode});if(Object.keys(d).length)ops.push({t:'set',col:'items',id:x.id,data:d})});
  }
  if(nameCh)S.imports.forEach(p=>{
    if(p.kind!=='jrnPending')return;const d={};
    if(p.dn===oldName)d.dn=newName;if(p.kn===oldName)d.kn=newName;
    if(Object.keys(d).length)ops.push({t:'set',col:'imports',id:p.id,data:d});
  });
  return ops;
}

function saveCoa(f){
  const g=n=>f.elements[n].value,err=m=>{$('#formErr',f).textContent=m};
  const a=S.accounts.find(x=>x.id===f.dataset.id);if(!a){closeSheet();return}

  const catLabel=g('catLabel').trim()||cat,parent=isHeader?'':g('parent'),saldo=numCell(g('saldo'));
  if(!code)return err('Isi kode akun.');
  if(!name)return err('Isi nama akun.');
  if(!cat)return err('Isi kategori.');
  if(S.accounts.some(x=>x.id!==a.id&&x.code===code&&x.name===name))return err('Akun dengan kode dan nama yang sama sudah ada.');
  if(isHeader&&S.accounts.some(x=>x.id!==a.id&&x.isHeader&&x.cat===cat&&x.name===name))return err('Sudah ada header dengan nama itu di kategori ini.');
  let autoMsg='';

    const orig=code;code=coaFreeCode(orig,cat,new Set(S.accounts.map(x=>String(x.code||'').trim())));

  }
  const oldSubs=a.isHeader?S.accounts.filter(x=>!x.isHeader&&coaGrp(x)===coaGrp(a)&&x.parent===a.name):[];

  let pr=parent;

    pr='';autoMsg=(autoMsg?autoMsg+'. ':'')+'Akun dipindah ke kategori "'+catLabel+'" tanpa header';

  /* header pindah label/kategori: subheader ikut pindah. Akun lain di kategori lama tidak berubah. */
  if(a.isHeader&&isHeader&&(name!==a.name||cat!==a.cat||catLabel!==(a.catLabel||a.cat))){
    oldSubs.forEach(x=>ops.push({t:'set',col:'accounts',id:x.id,data:{parent:name,cat,catLabel}}));

  }
  S.coaOpen['c|'+cat+'|'+catLabel]=true;
  ops.push(...coaRenameOps(a,name,code));

/* Hapus kategori beserta semua akun di dalamnya (konfirmasi menyebut akun yang masih dipakai jurnal / aset) */
function coaCatDel(cat,label){
  const gk=cat+'|'+label,list=S.accounts.filter(a=>coaGrp(a)===gk);
  if(!list.length)return;
  const codes=new Set(list.filter(a=>!a.isHeader).map(a=>a.code)),used=new Set();
  const chk=v=>{if(typeof v==='string'&&codes.has(v))used.add(v)};
  S.journals.forEach(j=>{(j.lines||[]).forEach(l=>chk(l&&l.acc));Object.keys(j).forEach(k=>{if(/acc/i.test(k))chk(j[k])})});
  S.assets.forEach(x=>['fixedAcc','creditAcc','accumAcc','expAcc'].forEach(k=>chk(x[k])));
  const saldo=list.reduce((t,a)=>t+(a.saldo||0),0);
  const msg=`Hapus kategori "${label}" beserta ${nf.format(list.length)} akun di dalamnya?`
    +(used.size?` ${nf.format(used.size)} akun masih dipakai pada jurnal/aset (${[...used].slice(0,4).join(', ')}${used.size>4?' …':''}); transaksinya tidak ikut terhapus tetapi akunnya hilang dari COA.`:'')
    +(saldo?` Total saldo awal akun-akun ini Rp${nf.format(Math.abs(saldo))} akan ikut hilang.`:'')
    +' Tindakan ini tidak dapat dibatalkan.';
  confirmSheet(msg,'Hapus kategori',()=>{
    const p1='c|'+gk,p2='h|'+gk+'|';
    Object.keys(S.coaOpen).forEach(k=>{if(k===p1||k.startsWith(p2))delete S.coaOpen[k]});
    commit(list.map(a=>({t:'del',col:'accounts',id:a.id})));
    toast('Kategori dihapus');refreshCoa();render(true);
  });
}
function coaDel(id){

const WS_COLS=['transactions','items','assets','accounts','txlog','imports','journals','recipes','menus'];
const wsRoot=id=>id==='main'?['users',S.user.uid]:['users',S.user.uid,'ws',id];
const wsName=id=>{const a=wsListFull().find(x=>x.id===id);return id===S.wsId?(S.cfg.business||(a&&a.name)||'Akun'):((a&&a.name)||'Akun')};
const slug=t=>String(t||'akun').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'akun';
async function readWs(id){
  const {db,fs}=S.fb,root=wsRoot(id),out={};
  for(const c of WS_COLS){const sn=await fs.getDocs(fs.collection(db,...root,c));out[c]=sn.docs.map(d=>({id:d.id,...d.data()}))}
  const st=await fs.getDoc(fs.doc(db,...root,'meta','settings'));
  out.settings=st.exists()?st.data():{};
  return out;
}
const snapWs=()=>({settings:S.cfg,transactions:S.tx,items:S.items,assets:S.assets,accounts:S.accounts,txlog:S.txlog,imports:S.imports,journals:S.journals});
async function batched(ops){
  const {db,fs}=S.fb;
  for(let k=0;k<ops.length;k+=400){const b=fs.writeBatch(db);ops.slice(k,k+400).forEach(f=>f(b));await b.commit()}
}
async function wipeAndWrite(id,data){
  const {db,fs}=S.fb,root=wsRoot(id);
  for(const c of WS_COLS){const sn=await fs.getDocs(fs.collection(db,...root,c));await batched(sn.docs.map(d=>b=>b.delete(d.ref)))}
  const ops=[];
  for(const c of WS_COLS)for(const d of (Array.isArray(data[c])?data[c]:[])){
    if(!d||typeof d!=='object'||!d.id)continue;
    const {id:did,...rest}=d;ops.push(b=>b.set(fs.doc(db,...root,c,String(did).replace(/\//g,'_')),rest));
  }
  ops.push(b=>b.set(fs.doc(db,...root,'meta','settings'),data.settings&&typeof data.settings==='object'?data.settings:{}));
  await batched(ops);
}

/* ---------- Kode user: kode acak tetap per akun, untuk mengaktifkan fitur khusus hanya di user tertentu ---------- */
function ucHash(str,seed){
  let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
  for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
const UC_ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function userCode(){
  const uid=(S.user&&S.user.uid)||'';
  if(!uid)return '';
  const enc=n=>{let o='';for(let i=0;i<5;i++){o+=UC_ALPHA[n%UC_ALPHA.length];n=Math.floor(n/UC_ALPHA.length)}return o};
  return enc(ucHash(uid+'|ec|a',1))+'-'+enc(ucHash(uid+'|ec|b',2));
}
/* Daftar fitur khusus: isi dengan kode user lalu nama fitur, mis. {'AB12C-DE34F':['namaFitur']}.
   Di kode fitur, bungkus dengan if(hasUserFeature('namaFitur')){...} agar hanya tampil untuk kode tersebut. */
const USER_FEATURES={};
const hasUserFeature=f=>{const l=USER_FEATURES[userCode()];return !!(l&&l.includes(f))};

function readLogo(file){
  return new Promise((res,rej)=>{
    if(!/^image\/(png|jpeg|webp)$/.test(file.type))return rej(new Error('Pilih file PNG, JPG, atau WebP.'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Gagal membaca file.'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('File gambar tidak dapat dibuka.'));
      img.onload=()=>{
        const k=Math.min(1,320/Math.max(img.width,img.height,1)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
        let out=c.toDataURL('image/png');
        if(out.length>300000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);out=c.toDataURL('image/jpeg',.85)}
        res(out)};
      img.src=fr.result};
    fr.readAsDataURL(file);
  });
}

/* Urutan baris laporan: klik 2x pada baris (Neraca / Laba Rugi), lalu geser. Tanpa ikon geser. */
{
  let last=null,timer=0,drag=null,swallow=0;
  const nodeOf=el=>el&&el.closest?el.closest('.ord-node'):null;
  const setOn=n=>{document.querySelectorAll('.ord-node.ord-on').forEach(x=>x.classList.remove('ord-on'));
    if(n){n.classList.add('ord-on');S.ordOn=n.dataset.ordk+'/'+n.dataset.ord}else S.ordOn=null};
  /* aksi klik tunggal ditunda sebentar agar klik 2x bisa dikenali */
  document.addEventListener('click',e=>{
    if(swallow>Date.now()){e.stopPropagation();e.preventDefault();return}
    const row=e.target.closest&&e.target.closest('.ord-node>.bs-row');
    if(!row){if(S.ordOn)setOn(null);return}
    const n=row.parentElement,id=n.dataset.ordk+'/'+n.dataset.ord;
    e.stopPropagation();e.preventDefault();
    clearTimeout(timer);
    if(last&&last.id===id&&Date.now()-last.t<350){last=null;const nmEl=e.target.closest&&e.target.closest('.nm[data-aid]');if(nmEl&&bsRenameStart(nmEl,n))return;setOn(n);toast('Seret baris untuk mengubah urutan');return}
    if(S.ordOn&&S.ordOn!==id)setOn(null);
    last={id,t:Date.now()};
    const act=ACT[row.dataset.act];
    timer=setTimeout(()=>{last=null;if(S.ordOn===id)setOn(null);if(act)act(row,e)},350);
  },true);
  document.addEventListener('pointerdown',e=>{
    if(e.button>0)return;
    const n=nodeOf(e.target);if(!n||!n.classList.contains('ord-on'))return;
    const row=n.querySelector(':scope>.bs-row');if(!row||!row.contains(e.target))return;
    drag={n,startY:e.clientY,moved:false,id:e.pointerId};
    try{row.setPointerCapture(e.pointerId)}catch(_){}
  });
  document.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const n=drag.n,dy=e.clientY-drag.startY;
    if(!drag.moved){if(Math.abs(dy)<6)return;drag.moved=true;n.classList.add('ord-drag')}
    e.preventDefault();
    n.style.transform='translateY('+dy+'px)';
    let tgt=null,place='';
    for(const c of n.parentElement.children){
      if(c===n||!c.classList.contains('ord-node')||c.dataset.ordk!==n.dataset.ordk)continue;
      const r=c.getBoundingClientRect(),mid=r.top+r.height/2,after=n.compareDocumentPosition(c)&Node.DOCUMENT_POSITION_FOLLOWING;
      if(after){if(e.clientY>mid){tgt=c;place='after'}}
      else if(e.clientY<mid&&!tgt){tgt=c;place='before'}
    }
    if(tgt){
      const vis=n.getBoundingClientRect().top;n.style.transform='';
      if(place==='after')tgt.after(n);else tgt.before(n);
      const sh=vis-n.getBoundingClientRect().top;drag.startY=e.clientY-sh;n.style.transform='translateY('+sh+'px)';
    }
  });
  const end=e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const n=drag.n,moved=drag.moved;drag=null;
    n.style.transform='';n.classList.remove('ord-drag');
    if(!moved)return;
    swallow=Date.now()+400;
    const key=n.dataset.ordk,ids=[...n.parentElement.children].filter(c=>c.classList.contains('ord-node')&&c.dataset.ordk===key).map(c=>c.dataset.ord);
    setOn(null);
    const ro={...(S.cfg.rowOrder||{}),[key]:ids};S.cfg.rowOrder=ro;
    commit([{t:'cfg',data:{rowOrder:ro}}]);
    render(true);
  };
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.ordOn)setOn(null)});
}

/* ---------- Auth ---------- */
const authMsg=e=>{
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return'Email atau kata sandi salah.';
  if(c==='auth/invalid-email')return'Format email tidak valid.';
  if(c==='auth/user-disabled')return'Akun ini dinonaktifkan. Hubungi admin.';
  if(c==='auth/too-many-requests')return'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
  if(c==='auth/network-request-failed')return'Tidak ada koneksi internet.';
  if(/api-key/.test(c))return'Konfigurasi Firebase tidak valid. Periksa firebaseConfig di index.html.';
  if(c==='auth/operation-not-allowed')return'Login email dan kata sandi belum diaktifkan di Firebase Console.';
  return'Gagal masuk. Coba lagi.';
};
async function doLogin(f){
  const email=f.elements.email.value.trim(),pass=f.elements.password.value,err=$('#loginErr'),btn=$('#loginBtn');
  err.textContent='';
  if(!email||!pass){err.textContent='Isi email dan kata sandi.';return}
  if(!S.fb){err.textContent='Layanan login belum termuat. Periksa koneksi internet lalu muat ulang halaman.';return}
  btn.disabled=true;btn.textContent='Memproses…';
  try{const {a,auth}=S.fb;await a.setPersistence(auth,a.browserLocalPersistence);await a.signInWithEmailAndPassword(auth,email,pass)}
  catch(e){err.textContent=authMsg(e)}
  btn.disabled=false;btn.textContent='Masuk';
}

    add(d(15),'out',1200000,'Pemasaran','E-Wallet','Iklan media sosial',null,0);
    add(d(ri(14,18)),'out',ri(380000,640000),'Perlengkapan','Kas','Perlengkapan kemasan',null,0);
    add(d(20),'out',ri(180000,320000),'Pajak','Bank','Pajak usaha',null,0);

  try{
    const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [appM,a,fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const app=appM.initializeApp(FIREBASE_CONFIG),auth=a.getAuth(app);
    let db;try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(app)}
    S.fb={app,auth,db,a,fs};
  }catch(e){S.fb=null}
  clearTimeout(fallback);
  if(!S.fb){if(wantDemo)startDemo();else showLogin();return}
  if(wantDemo)S.demoPending=true;
  const {a,auth}=S.fb;
  a.onAuthStateChanged(auth,u=>{
    if(u){if(S.user&&S.user.uid===u.uid&&!S.localDemo)return;S.localDemo=false;S.user=u;S.demo=(u.email||'').toLowerCase()===DEMO_EMAIL;enterApp()}
    else{if(S.demoPending||S.localDemo)return;S.user=null;S.demo=false;leaveApp();showLogin()}
  });
  if(wantDemo){try{await auth.authStateReady()}catch(e){}if(auth.currentUser)S.demoPending=false;else startDemo()}
}
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('.fr-page')){frRead();cvPrevRefresh()}});
document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('.fr-page')){frRead();if(e.target.id==='frPer')render(true)}});
boot();
</script>
