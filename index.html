h1{font-size:calc(24px*var(--fs));line-height:1.2;font-weight:800;letter-spacing:-.02em}

h3{font-size:calc(13px*var(--fs));font-weight:700;color:var(--muted);letter-spacing:.01em}
small{font-size:calc(12.5px*var(--fs));color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:8px}

/* ---------- Splash ---------- */
.splash{position:fixed;inset:0;z-index:300;display:grid;place-content:center;gap:22px;justify-items:center;background:var(--bg)}
.splash img{width:84px;height:84px}
.splash-bar{width:120px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.splash-bar::after{content:"";display:block;width:40%;height:100%;border-radius:4px;background:var(--primary);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

/* ---------- Buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:12px;font-weight:700;font-size:calc(15px*var(--fs));background:var(--surface2);color:var(--ink);transition:transform .12s,background .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:transparent;color:var(--neg);box-shadow:inset 0 0 0 1.5px var(--neg)}
.btn.ghost{background:transparent;color:var(--primary-text)}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:calc(14px*var(--fs));border-radius:10px}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--muted)}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.f{display:grid;gap:6px;margin-bottom:14px}
.f>span{font-size:calc(13px*var(--fs));font-weight:600;color:var(--muted)}
.f input,.f select{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:max(16px,calc(16px*var(--fs)));transition:border-color .15s,box-shadow .15s}
.f input:focus,.f select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.f input::placeholder{color:#9AA8C4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.money-wrap{position:relative}
.money-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:700;color:var(--muted)}
.money-wrap input{padding-left:44px!important;font-weight:700;font-variant-numeric:tabular-nums}
.pw{position:relative}
.pw input{padding-right:48px!important}
.pw .icon-btn{position:absolute;right:4px;top:4px}
.err{min-height:20px;margin:-4px 0 10px;font-size:calc(13.5px*var(--fs));font-weight:600;color:var(--neg)}
.hint{font-size:calc(12.5px*var(--fs));color:var(--muted)}
.seg{display:flex;padding:4px;gap:4px;border-radius:14px;background:var(--surface2);margin-bottom:16px}
.seg button{flex:1;height:38px;border-radius:10px;font-weight:700;font-size:calc(14px*var(--fs));color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--primary-text);box-shadow:0 1px 3px rgba(14,26,51,.12)}
[data-theme="dark"] .seg button.on{background:var(--primary-soft)}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}

/* ---------- Login ---------- */
.login{min-height:100dvh;display:grid;grid-template-columns:1fr}
.login-art{display:none}
.login-panel{display:grid;place-items:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom))}
.login-card{width:100%;max-width:400px}
.login-logo{width:76px;height:76px;margin:0 0 22px}
.login-card h1{margin-bottom:6px}
.login-card .muted{margin-bottom:26px}
.login-card .btn+.btn{margin-top:8px}
@media(min-width:960px){
  .login{grid-template-columns:1.05fr 1fr}
  .login-art{display:flex;flex-direction:column;justify-content:flex-end;padding:56px;position:relative;overflow:hidden;color:#0A2150;background:linear-gradient(150deg,#8CB6E0 0%,#5D92C9 100%)}
  .login-art h2{font-size:calc(38px*var(--fs));line-height:1.12;font-weight:800;letter-spacing:-.03em;max-width:12ch}
  .login-art p{margin-top:14px;max-width:34ch;opacity:.82;font-size:max(16px,calc(16px*var(--fs)))}
  .login-art svg{position:absolute;right:48px;top:56px;width:230px;opacity:.14}
}

/* ---------- App shell ---------- */
.main{max-width:760px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 56px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 10px;background:var(--bg)}
.topbar img{width:30px;height:30px}
.topbar h1{font-size:calc(22px*var(--fs))}
.topbar h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:520px){.topbar{gap:6px}.topbar .icon-btn{width:34px;height:34px;border-radius:10px}.topbar .icon-btn svg{width:19px;height:19px}.topbar h1{font-size:calc(17px*var(--fs))}.topbar img{width:26px;height:26px}}
@media(max-width:430px){.topbar{gap:4px}.topbar img{display:none}.topbar .icon-btn{width:32px;height:32px}}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -8px 28px rgba(14,26,51,.09)}
[data-theme="dark"] .bottombar{box-shadow:0 -1px 0 var(--line)}
.bottombar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:calc(11.5px*var(--fs));font-weight:600;color:var(--muted)}
.bottombar button[aria-current="page"]{color:var(--primary-text)}
.bottombar .fab .circle{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--primary-ink);box-shadow:0 8px 20px rgba(79,134,191,.42),0 0 0 6px var(--surface);transition:transform .15s}
.bottombar .fab:active .circle{transform:translateX(-50%) scale(.94)}
.demo-bar{margin:0 0 12px;padding:9px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:calc(13px*var(--fs));font-weight:600}

@media(min-width:960px){
  .topbar{max-width:1120px;margin:0 auto;padding-top:20px}
  .main{max-width:none;padding:14px 44px calc(var(--nav-h) + 72px)}
  .main-inner{max-width:1120px;margin:0 auto}
  .bottombar{left:50%;right:auto;width:min(560px,calc(100% - 48px));transform:translateX(-50%);bottom:18px;height:var(--nav-h);padding-bottom:0;border-radius:24px;box-shadow:0 10px 36px rgba(14,26,51,.16)}
  [data-theme="dark"] .bottombar{box-shadow:0 0 0 1px var(--line),0 10px 36px rgba(0,0,0,.4)}
  .bottombar button:not(.fab):hover{color:var(--ink)}
}

/* ---------- Page ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;margin:6px 0 18px;flex-wrap:wrap}
.page-head p{color:var(--muted);font-size:calc(14px*var(--fs));margin-top:2px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.grid.cols{grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.grid.cols{grid-template-columns:1.55fr 1fr;align-items:start}.grid.stats3{grid-template-columns:repeat(3,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
@media(max-width:480px){.panel-head{flex-wrap:wrap}}
.link{color:var(--primary-text);font-weight:700;font-size:calc(13.5px*var(--fs))}

.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 22px;color:#0A2150;background:linear-gradient(140deg,#8CB6E0 0%,#5D92C9 100%);margin-bottom:18px}
.hero-art{position:absolute;right:-6px;bottom:-4px;width:150px;opacity:.12;pointer-events:none}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.hero-top span{font-size:calc(13.5px*var(--fs));font-weight:600;opacity:.85}
.month-nav{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.3);border-radius:999px;padding:2px}
.month-nav button{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:inherit}
.month-nav button:disabled{opacity:.35}
.month-nav b{font-size:calc(13px*var(--fs));font-weight:700;padding:0 8px;min-width:104px;text-align:center}
.hero-bal{position:relative;font-size:calc(clamp(28px,7.4vw,40px)*var(--fs));font-weight:800;letter-spacing:-.03em;margin:10px 0 18px;line-height:1.1}
.hero-stats{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:480px){.hero-stats{grid-template-columns:repeat(2,1fr);row-gap:12px}}
.hero-stats div{min-width:0}
.hero-stats small{display:block;color:inherit;opacity:.72;font-size:calc(12px*var(--fs))}
.hero-stats b{display:block;font-size:calc(clamp(13px,3.7vw,17px)*var(--fs));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.legend{display:flex;gap:14px;font-size:calc(12.5px*var(--fs));color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}
.gt{fill:var(--muted);font-size:calc(11px*var(--fs));font-family:inherit}
.gt.on{fill:var(--ink);font-weight:700}
.plc-chart .gt{font-size:calc(14px*var(--fs))}
.b-in{fill:var(--primary)}.b-out{fill:var(--bar2)}

.bars{display:grid;gap:14px}
.bar-row{display:grid;gap:6px}
.bar-row div:first-child{display:flex;justify-content:space-between;font-size:calc(14px*var(--fs));font-weight:600;gap:10px}
.bar-track{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:8px;background:var(--primary)}

.list{display:grid}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;text-align:left;border-bottom:1px solid var(--line)}
.list>.row:last-child{border-bottom:0}
.row:hover .row-main b{color:var(--primary-text)}
.row-ico{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--primary-text)}
.row-ico.in{background:rgba(10,138,96,.12);color:var(--pos)}
.row-ico.out{background:rgba(207,56,83,.11);color:var(--neg)}
.row-main{flex:1;min-width:0;display:grid}
.row-main b{font-weight:700;font-size:calc(14.5px*var(--fs));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.row-main small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-end{display:grid;justify-items:end;flex:none}
.row-end b{font-weight:800;font-size:calc(14.5px*var(--fs));white-space:nowrap}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:calc(11.5px*var(--fs));font-weight:700;background:var(--warn-soft);color:var(--warn)}
.badge.red{background:rgba(207,56,83,.12);color:var(--neg)}
.day-head{padding:14px 0 4px;font-size:calc(12.5px*var(--fs));font-weight:700;color:var(--muted)}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:30px 12px;color:var(--muted)}
.empty b{color:var(--ink);font-size:max(16px,calc(16px*var(--fs)))}
.empty .ring{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;background:var(--primary-soft);color:var(--primary-text)}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.stat small{display:block;margin-bottom:4px}
.stat b{font-size:calc(20px*var(--fs));font-weight:800;letter-spacing:-.02em}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(min-width:700px){.stats-row.three{grid-template-columns:repeat(3,1fr)}}
.stats-row.four{margin-top:0}
@media(min-width:700px){.stats-row.four{grid-template-columns:repeat(4,1fr)}}
.pl-top{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.pl-top .bs-filter{margin-bottom:8px}
.pl-top .bs-sel,.pl-top .bs-date{max-width:260px}
.pl-per{margin:0;font-weight:700;font-size:calc(14px*var(--fs))}
.pl-sub{display:flex;justify-content:space-between;align-items:center;padding:10px;margin:6px 0;border-radius:12px;background:var(--bg);font-weight:800;font-size:calc(14px*var(--fs))}
.pl-sum{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.pl-sumrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:calc(14px*var(--fs))}
.pl-sumrow span{color:var(--muted);font-weight:600}
.pl-sumrow b{font-weight:700}
.pl-sumrow.b{margin-top:2px;padding-top:10px;border-top:1px solid var(--line)}
.pl-sumrow.b span{color:var(--ink);font-weight:800}
.pl-sumrow.b b{font-weight:800}
.stats-row.three .stat:first-child{grid-column:1/-1}
@media(min-width:700px){.stats-row.three .stat:first-child{grid-column:auto}}

.search{position:relative;flex:1;min-width:150px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:44px;padding:0 14px 0 40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:max(16px,calc(16px*var(--fs)))}
#invSearch,#rcSearch{height:38px}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.select{height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:calc(15px*var(--fs));font-weight:600}
.chips{display:flex;gap:8px;margin:12px 0 4px}
.chip{height:34px;padding:0 14px;border-radius:999px;font-size:calc(13.5px*var(--fs));font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.on{background:var(--primary);color:var(--primary-ink)}

.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:calc(14.5px*var(--fs))}
.line.total{font-weight:800;border-bottom:0;padding-top:12px}
.line.big{font-size:calc(17px*var(--fs));font-weight:800;border-top:2px solid var(--ink);border-bottom:0;margin-top:6px;padding-top:14px}
.group{margin-bottom:22px}
.group>h3{margin:0 0 8px 4px}
.grp-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px 4px}.grp-head h3{margin:0}.grp-head .link:disabled{opacity:.4;cursor:default}
.group .panel{padding:6px 18px}
.group form.panel{padding:18px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{overflow:hidden;text-overflow:ellipsis}
.print-only{display:none}
.alert{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:rgba(207,56,83,.1);color:var(--neg);font-weight:600;font-size:calc(14px*var(--fs))}
.skel{display:grid;gap:14px}
.skel i{display:block;height:92px;border-radius:18px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:shine 1.2s linear infinite}
.skel i:first-child{height:170px;border-radius:24px}
@keyframes shine{to{background-position:-200% 0}}

/* ---------- Sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(7,14,31,.5);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:520px;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:0 20px 22px;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet-grip{width:38px;height:4px;border-radius:4px;background:var(--line);margin:12px auto 6px}
.sheet-head{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;margin:0 -20px 10px;padding:6px 20px 10px;background:var(--surface)}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;border:1.5px solid var(--line);text-align:left;width:100%;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--primary);background:var(--primary-soft)}
.choice span:last-child{display:grid}
.choice b{font-size:calc(15.5px*var(--fs))}
/* Pop up selalu di tengah layar (HP maupun desktop), ada jarak di semua sisi, tidak full screen */
.sheet-wrap{align-items:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.sheet-head{padding-top:22px}
.sheet{max-height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));border-radius:24px;padding-top:0;transform:translateY(14px) scale(.98);opacity:0;transition:transform .22s,opacity .2s}
.sheet-wrap.open .sheet{transform:none;opacity:1}
.sheet-grip{display:none}
/* Keyboard HP terbuka: pop-up mengikuti area layar yang terlihat, tidak ikut bergeser/terpotong */
.sheet-wrap.kb{inset:auto;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);padding-top:8px;padding-bottom:8px;align-items:flex-start}
.sheet-wrap.kb .sheet,.sheet-wrap.kb .sheet.sheet-fit{max-height:calc(var(--vvh,100dvh) - 16px)}
.sheet-wrap.kb .sheet.sheet-fit{padding-bottom:0}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 38px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:400;max-width:calc(100% - 32px);padding:11px 18px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:calc(14px*var(--fs));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:960px){.toast{bottom:104px}}

/* ---------- Aset baru ---------- */
.date-wrap{position:relative}
.f .dtx{padding-right:48px}
.date-btn{position:absolute;right:4px;top:4px;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;color:var(--muted)}
.date-btn:hover{background:var(--surface2);color:var(--ink)}
.f .date-native,.date-wrap .date-native{position:absolute;right:4px;top:4px;width:40px;height:40px;padding:0;margin:0;border:0;border-radius:10px;opacity:0;cursor:pointer;z-index:2;font-size:16px;-webkit-appearance:none;appearance:none;background:transparent}
.date-wrap .date-native::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer}
.date-wrap:has(.date-native:hover) .date-btn{background:var(--surface2);color:var(--ink)}
.set-tabs{position:sticky;top:var(--top-h,56px);z-index:15;display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;margin-bottom:6px;background:var(--bg);scrollbar-width:none}
.set-tabs::-webkit-scrollbar{display:none}
.set-tab{flex:none;height:40px;padding:0 16px;border-radius:12px;font-weight:700;font-size:calc(14px*var(--fs));color:var(--muted);background:var(--surface2);transition:background .15s,color .15s}
.set-tab:hover{color:var(--ink)}
.set-tab.on{background:var(--primary);color:var(--primary-ink)}
.set-tab-ico{display:inline-flex;align-items:center;justify-content:center;width:48px;padding:0}
.sheet.sheet-wide{max-width:600px}
.ae-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
.ae-grid>*{min-width:0}
.ae-grid .full{grid-column:1/-1}
.ae-row3{display:grid;grid-template-columns:1fr;gap:0 12px;align-items:start}
@media(min-width:560px){.ae-row3{grid-template-columns:1.2fr 1fr 1fr}}
.ae-row3>*{min-width:0}
.ae-grid .chk.slim{margin-bottom:8px}
.ae-grid .chk.slim small{display:none}
.ast-c{position:relative}

const TX_KIND={general:'Jurnal Umum',expense:'Biaya',purchase:'Pembelian',opname:'Stock opname',asset:'Aset'};
const logAccs=(x,col)=>{
  const a=col==='assets'?[x.fixedAcc,x.creditAcc]:(Array.isArray(x.lines)&&x.lines.length?x.lines.map(l=>l.acc):[x.debitAcc,x.creditAcc]);
  return [...new Set(a.filter(Boolean).map(String))];
};
const logRowData=(action,x,col,ref)=>({action,at:Date.now(),src:col,ref:ref||'',accs:logAccs(x,col),kind:col==='assets'?'asset':(x.kind||'general'),
  name:col==='assets'?(x.name||'Aset'):(x.desc||x.itemName||''),no:col==='assets'?(x.noAset||''):(x.no||''),amount:col==='assets'?(x.cost||x.amount||0):(x.amount||0)});
function autoLogOps(ops){
  const out=[];
  ops.forEach(o=>{
    if(o.col!=='journals'&&o.col!=='assets')return;
    if(o.t==='add'&&o.data){
      if(!o.id)o.id=S.demo?('d'+Math.random().toString(36).slice(2,9)):S.fb.fs.doc(S.fb.fs.collection(S.fb.db,...wsBase(),o.col)).id;
      out.push({t:'add',col:'txlog',data:logRowData('add',o.data,o.col,o.id)});
    }else if(o.t==='del'){
      const x=(o.col==='assets'?S.assets:S.journals).find(i=>i.id===o.id);
      if(x)out.push({t:'add',col:'txlog',data:logRowData('del',x,o.col,o.id)});
    }
  });
  return out;
}
function commit(ops){
  ops=ops.concat(autoLogOps(ops));
  if(S.demo){
    const arr=c=>c==='transactions'?S.tx:c==='assets'?S.assets:c==='accounts'?S.accounts:c==='imports'?S.imports:c==='txlog'?S.txlog:c==='journals'?S.journals:c==='recipes'?S.recipes:c==='menus'?S.menus:S.items;
    for(const o of ops){
      if(o.t==='add')arr(o.col).push({id:o.id||('d'+Math.random().toString(36).slice(2,9)),...o.data});
      else if(o.t==='set'){const x=arr(o.col).find(i=>i.id===o.id);if(x)Object.assign(x,o.data)}
      else if(o.t==='del'){const a=arr(o.col);const i=a.findIndex(x=>x.id===o.id);if(i>-1)a.splice(i,1)}
      else if(o.t==='inc'){const x=arr(o.col).find(i=>i.id===o.id);if(x)x[o.field]=(x[o.field]||0)+o.by}
      else if(o.t==='cfg')Object.assign(S.cfg,o.data);
    }
    render(true);return;
  }
  const {db,fs}=S.fb;const base=wsBase();
  const fail=e=>toast(e&&e.code==='permission-denied'?'Tidak diizinkan menyimpan. Periksa aturan Firestore.':'Gagal menyimpan. Coba lagi.');
  for(let k=0;k<ops.length;k+=400){
    const b=fs.writeBatch(db);
    for(const o of ops.slice(k,k+400)){
      if(o.t==='add')b.set(o.id?fs.doc(db,...base,o.col,o.id):fs.doc(fs.collection(db,...base,o.col)),o.data);
      else if(o.t==='set')b.set(fs.doc(db,...base,o.col,o.id),o.data,{merge:true});
      else if(o.t==='del')b.delete(fs.doc(db,...base,o.col,o.id));
      else if(o.t==='inc')b.update(fs.doc(db,...base,o.col,o.id),{[o.field]:fs.increment(o.by)});
      else if(o.t==='cfg')b.set(fs.doc(db,...base,'meta','settings'),o.data,{merge:true});
    }
    b.commit().catch(fail);
  }
}

function plBarChart(s){
  LINE_S=s;
  const W=LINE_W||600,H=230,L=48,R=6,T=10,B=28,ph=H-T-B,pw=W-L-R;
  const mx=niceMax(Math.max(...s.flatMap(x=>[x.p,x.b]),100000));
  const step=pw/s.length,bw=Math.min(52,step/2.6);let g='';
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl"/><text x="${L-8}" y="${y+4}" text-anchor="end" class="gt">${compact(mx*i/4)}</text>`}
  s.forEach((x,i)=>{const cx=L+step*i+step/2,hp=Math.max(0,x.p)/mx*ph,hb=Math.max(0,x.b)/mx*ph;
    g+=`<rect x="${cx-bw-2}" y="${T+ph-hp}" width="${bw}" height="${hp}" rx="5" class="b-in"/><rect x="${cx+2}" y="${T+ph-hb}" width="${bw}" height="${hb}" rx="5" class="b-out"/><text x="${cx}" y="${H-8}" text-anchor="middle" class="gt${i===s.length-1?' on':''}">${shortMonth(x.k)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik batang pendapatan dan beban tiga bulan terakhir" class="chart pl-chart">${g}</svg>`;
}
function barChart(s){
  BAR_S=s;
  const W=BAR_W||600,H=230,L=48,R=6,T=10,B=28,ph=H-T-B,pw=W-L-R;
  const mx=niceMax(Math.max(...s.flatMap(x=>[x.inc,x.out]),100000));
  const step=pw/s.length,bw=Math.min(52,step/2.6);let g='';
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl"/><text x="${L-8}" y="${y+4}" text-anchor="end" class="gt">${compact(mx*i/4)}</text>`}
  s.forEach((x,i)=>{const cx=L+step*i+step/2,hi=x.inc/mx*ph,ho=x.out/mx*ph;
    g+=`<rect x="${cx-bw-2}" y="${T+ph-hi}" width="${bw}" height="${hi}" rx="5" class="b-in"/><rect x="${cx+2}" y="${T+ph-ho}" width="${bw}" height="${ho}" rx="5" class="b-out"/><text x="${cx}" y="${H-8}" text-anchor="middle" class="gt${i===s.length-1?' on':''}">${shortMonth(x.k)}</text>`});

}

/* ---------- Neraca ---------- */
const BS_ASET=[
  {k:'lancar',l:'Aset Lancar',s:'Kas, bank & e-wallet',c:'#6FA3D8'},
  {k:'persediaan',l:'Aset Persediaan',s:'Barang dagang & bahan',c:'#2FB59B'},
  {k:'piutang',l:'Aset Piutang',s:'Tagihan ke pelanggan',c:'#F2B544'},
  {k:'lancarLain',l:'Aset Lancar Lainnya',s:'Uang muka, biaya dibayar di muka',c:'#9B7BEA'},
  {k:'tetap',l:'Aset Tetap',s:'Nilai buku setelah akumulasi penyusutan',c:'#EF7B6C'},
  {k:'lainnya',l:'Aset Lainnya',s:'Aset non-lancar lain',c:'#8A97B1'}
];
const BS_PASIVA=[
  {k:'utang',l:'Hutang',s:'Kewajiban usaha',c:'#CF3853'},
  {k:'modal',l:'Modal',s:'Ekuitas pemilik',c:'#4F86BF'}
];
const BS_PERIODS=[['today','Hari ini'],['eolm','Akhir bulan lalu'],['eoly','Akhir tahun lalu'],['custom','Custom']];
function bsDate(){
  const m=S.bs.mode,n=new Date();
  if(m==='eolm')return iso(new Date(n.getFullYear(),n.getMonth(),0));
  if(m==='eoly')return (n.getFullYear()-1)+'-12-31';
  if(m==='custom')return S.bs.date||today();
  return today();
}
/* Klasifikasi akun COA ke kelompok neraca; null = bukan akun neraca (pendapatan/beban) */
function bsClass(a){
  const cat=String(a.cat||'').toUpperCase(),lab=String(a.catLabel||'').toLowerCase(),nm=String(a.name||'').toLowerCase();
  if(cat!=='BO'&&cat!=='KW'&&/(dibayar di ?muka|biaya dimuka|uang muka)/.test(nm))return{g:'lancarLain'};
  if(cat==='BO'||/^(beban|biaya|pendapatan|penjualan|hpp|harga pokok)/.test(nm)||/^(beban|biaya|pendapatan|hpp|harga pokok)/.test(lab))return null;
  if(cat==='KAT'||/akumulasi/.test(nm+' '+lab))return{g:'tetap',contra:true};
  if(cat==='AT'||/aset tetap/.test(lab)||/^(aset tetap|aktiva tetap)/.test(nm))return{g:'tetap'};
  if(/piutang/.test(nm+' '+lab))return{g:'piutang'};
  if(/persediaan|inventory|stok/.test(nm+' '+lab))return{g:'persediaan'};
  if(cat==='KW'||/\b(utang|hutang)|kewajiban|liabilit/.test(nm+' '+lab))return{g:'utang'};
  if(cat==='MD'||/modal|ekuitas|laba ditahan|prive|saham/.test(nm+' '+lab))return{g:'modal'};
  if(/lancar lain|uang muka|dibayar di ?muka|pajak dibayar/.test(nm+' '+lab))return{g:'lancarLain'};
  if(cat==='AL'||/aset lancar|aktiva lancar|\bkas\b|\bbank\b|e-?wallet|setara kas/.test(nm+' '+lab))return{g:'lancar'};
  if(/aset lain|aktiva lain|investasi|tak berwujud|lain-lain/.test(nm+' '+lab)&&/^a/.test(cat.toLowerCase()||lab))return{g:'lainnya'};
  return null;
}
/* Hitung neraca per tanggal D. Saldo COA = saldo awal; aset yang sudah diinput (tanggal perolehan <= D)
   ditambahkan: nilai perolehan di akun aset tetap, lawan di akun yang dikreditkan, akumulasi penyusutan
   (garis lurus per hari) dan beban penyusutan yang mengurangi modal. */
function bsCalc(dOverride){
  const D=dOverride||bsDate(),adj={},norm=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');
  const list=[...S.accounts],byCode=new Map();
  list.forEach(a=>{if(!a.isHeader)byCode.set(a.code,a)});
  const ensure=(code,cat,catLabel)=>{if(!code)return null;let a=byCode.get(code);if(!a){a={id:'v'+code,code,name:coaNameOnly(code),cat,catLabel,isHeader:false,parent:'',saldo:0,ord:99999};list.push(a);byCode.set(code,a)}return a};
  const bump=(a,v)=>{if(a)adj[a.code]=(adj[a.code]||0)+v};
  const dayMs=864e5,t0=s=>new Date(s+'T00:00:00').getTime();
  let dep=0;
  S.assets.filter(x=>x.date&&x.date<=D&&x.cost>0).forEach(x=>{
    bump(ensure(x.fixedAcc,'AT','Aset Tetap'),x.cost);
    const cg=(COA.find(c=>c.c===x.creditAcc)||{}).g,ex=byCode.get(x.creditAcc),k=ex?bsClass(ex):null;
    const isLiab=k?(k.g==='utang'||k.g==='modal'):(cg==='utang'||cg==='modal');
    if(x.creditAcc){
      const cr=ensure(x.creditAcc,cg==='utang'?'KW':cg==='modal'?'MD':'AL',cg==='utang'?'Kewajiban':cg==='modal'?'Modal':'Aset Lancar');
      bump(cr,isLiab?x.cost:-x.cost);
    }
    if(!x.nonDep&&x.usefulDays>0){
      const base=Math.max(0,x.cost-(x.residual||0)),days=Math.max(0,Math.floor((t0(D)-t0(x.date))/dayMs));
      const d=Math.min(base,base*days/x.usefulDays);
      if(d>0){bump(ensure(x.accumAcc,'KAT','Akumulasi Penyusutan'),d);dep+=d}
    }
  });
  let profit=0;
  S.journals.forEach(j=>jEvents(j,D).forEach(e=>{
    const a=byCode.get(e.code),k=a&&bsClass(a);
    if(k)bump(a,e.side===((k.contra||k.g==='utang'||k.g==='modal')?'K':'D')?e.amt:-e.amt);
    else if(a)profit+=e.side==='K'?e.amt:-e.amt;
  }));
  const val=(a,k)=>{const v=(a.saldo||0)+(adj[a.code]||0);return k&&k.contra?-Math.abs(v):v};
  const groups={};[...BS_ASET,...BS_PASIVA].forEach(g=>groups[g.k]={...g,total:0,nodes:[]});
  const push=(k,node)=>{const g=groups[k];g.nodes.push(node);g.total+=node.total};
  for(const c of coaTree(list))for(const t of c.tops){
    const a=t.acc;let done=false;
    if(a.isHeader&&t.subs.length){
      const by={};
      t.subs.forEach(s=>{const k=bsClass(s);if(!k)return;const v=val(s,k);if(Math.round(v)!==0)(by[k.g]=by[k.g]||[]).push({acc:s,v})});
      for(const gk in by){push(gk,{hdr:a,rows:by[gk],total:sum(by[gk],r=>r.v)});done=true}
      if(done)continue;
    }
    const k=bsClass(a);if(!k)continue;const v=val(a,k);if(Math.round(v)===0)continue;
    push(k.g,{hdr:null,rows:[{acc:a,v}],total:v});
  }
  const lr=profit-dep;
  if(Math.round(lr)!==0)push('modal',{hdr:null,rows:[{acc:{code:'LR',name:'Laba (rugi) berjalan'},v:lr}],total:lr});
  const aset=sum(BS_ASET,g=>groups[g.k].total),hutang=groups.utang.total,modal=groups.modal.total;
  return{D,groups,aset,hutang,modal,dep,pasiva:hutang+modal,diff:aset-(hutang+modal)};
}
/* ---------- Transaksi cepat (jurnal debit/kredit) ---------- */
const jNextNo=()=>{let m=0;S.journals.forEach(j=>{const x=/^TRX-(\d+)$/i.exec(String(j.no||'').trim());if(x)m=Math.max(m,+x[1])});return 'TRX-'+String(m+1).padStart(4,'0')};
const jEom=m=>iso(new Date(+m.slice(0,4),+m.slice(5,7),0));
/* Rangkaian posting jurnal sampai tanggal upto. Amortisasi: nominal dicatat di akun dibayar di muka, lalu
   dibebankan ke akun debit secara garis lurus per hari selama jumlah hari. */
function jEvents(j,upto){
  const out=[],amt=j.amount||0;if(!(amt>0)||!j.date||j.date>upto)return out;
  const base={no:j.no||'',desc:j.desc||''};
  if(j.kind==='general'){(j.lines||[]).forEach(l=>{if(l&&l.acc&&l.amt>0)out.push({...base,date:j.date,code:l.acc,side:l.side,amt:l.amt})});return out}
  if(!j.amort||!(j.days>0)||!j.prepaidAcc){
    out.push({...base,date:j.date,code:j.debitAcc,side:'D',amt},{...base,date:j.date,code:j.creditAcc,side:'K',amt});return out;
  }
  out.push({...base,date:j.date,code:j.prepaidAcc,side:'D',amt},{...base,date:j.date,code:j.creditAcc,side:'K',amt});
  const t0=s=>new Date(s+'T00:00:00').getTime(),cum=d=>Math.min(amt,amt*Math.max(0,Math.floor((t0(d)-t0(j.date))/864e5))/j.days);
  let prev=0;const lastM=upto.slice(0,7);
  for(let m=j.date.slice(0,7);m<=lastM;m=addMonths(m,1)){
    const d=m===lastM?upto:jEom(m);if(d<j.date)continue;
    const c=cum(d),a=c-prev;
    if(a>0.5){const b={no:(j.no||'')+'-AMT',desc:'Amortisasi: '+(j.desc||''),date:d,amt:a};out.push({...b,code:j.prepaidAcc,side:'K'},{...b,code:j.debitAcc,side:'D'})}
    prev=c;if(c>=amt)break;
  }
  return out;
}
function jAccOptions(name){
  let A=S.accounts.filter(a=>!a.isHeader).sort((a,b)=>(a.ord||0)-(b.ord||0));
  if(name==='jPrepaid'){const p=A.filter(a=>/dibayar di ?muka|biaya dimuka|uang muka|prepaid/i.test(a.name));if(p.length)A=p}
  if(!A.length)return COA.map(a=>({v:a.c,l:a.n}));
  const seen=new Set();return A.filter(a=>!seen.has(a.code)&&seen.add(a.code)).map(a=>({v:a.code,l:a.name}));
}

function saveJournal(f){
  const g=n=>f.elements[n].value,err=m=>{$('#formErr',f).textContent=m};
  const date=parseDmy(g('dateText')),amount=parseMoney(g('amount')),amort=f.elements.amort.checked,days=parseInt(g('days'),10)||0;
  if(!date)return err('Isi tanggal dengan format dd/mm/yyyy.');
  if(!g('desc').trim())return err('Isi keterangan.');
  if(!g('jDebit'))return err('Pilih akun debit.');
  if(!g('jCredit'))return err('Pilih akun kredit.');
  if(g('jDebit')===g('jCredit'))return err('Akun debit dan kredit tidak boleh sama.');
  if(!(amount>0))return err('Isi nominal lebih dari 0.');
  if(amort&&!(days>0))return err('Isi jumlah hari amortisasi.');
  if(amort&&!g('jPrepaid'))return err('Pilih akun dibayar di muka.');
  const data={no:g('no'),date,desc:g('desc').trim(),debitAcc:g('jDebit'),creditAcc:g('jCredit'),amount,amort,days:amort?days:null,prepaidAcc:amort?g('jPrepaid'):''};
  const id=f.dataset.id,dr=debtRead(f,date,id?S.journals.find(x=>x.id===id):null);
  if(dr.err)return err(dr.err);
  if(id||dr.on)Object.assign(data,dr.data);
  if(id)commit([{t:'set',col:'journals',id,data}]);
  else{data.no=jNextNo();data.ts=Date.now();commit([{t:'add',col:'journals',data}])}
  closeSheet();toast('Transaksi disimpan');render(true);
}

/* ---------- Pengingat hutang: centang di form input, tampil di Dashboard di bawah Arus Kas ---------- */
const DEBT_DAY=11; /* jatuh tempo otomatis: tanggal 11 bulan berikutnya dari tanggal transaksi (bisa diubah per transaksi) */
function isDebtAcc(code){
  if(!code)return false;
  const a=S.accounts.find(x=>x.code===code&&!x.isHeader);
  if(a){const k=bsClass(a);return !!k&&k.g==='utang'}
  const c=COA.find(x=>x.c===code);return !!c&&c.g==='utang';
}
function debtDefaultDue(iso){
  const m=/^(\d{4})-(\d{2})-/.exec(iso||'');if(!m)return '';
  let y=+m[1],mo=+m[2]+1;if(mo>12){mo=1;y++}
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(DEBT_DAY).padStart(2,'0');
}

document.addEventListener('dblclick',e=>{
  const td=e.target.closest&&e.target.closest('.debt-dt');if(!td||td.querySelector('input'))return;
  const src=td.dataset.src,id=td.dataset.id,x=debtReminders().find(d=>d.src===src&&d.id===id);if(!x)return;
  e.preventDefault();getSelection&&getSelection().removeAllRanges();

  inp.style.cssText='height:36px;padding:0 8px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card,#fff);color:inherit;max-width:100%';
  td.textContent='';td.appendChild(inp);inp.focus();
  let done=false;
  const finish=save=>{
    if(done)return;done=true;
    const v=inp.value;
    if(save&&v&&v!==x.due){
      const a=src==='a',rec=(a?S.assets:S.journals).find(i=>i.id===id),base=rec&&rec.date;
      if(base&&v<base){toast('Tanggal reminder tidak boleh sebelum tanggal transaksi');render(true);return}

    }
    render(true);

  inp.addEventListener('blur',()=>setTimeout(()=>finish(true),150));
  inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();finish(true)}else if(ev.key==='Escape'){ev.preventDefault();finish(false)}});
  try{inp.showPicker&&inp.showPicker()}catch(_){}
});

/* daftar pengingat aktif (belum lunas), urut jatuh tempo terdekat */
function debtReminders(){
  const out=[];
  S.journals.forEach(j=>{
    if(!j.debtRem||j.debtDone||!j.debtDue)return;
    let acc='',amt=0;
    if(j.kind==='general'){(j.lines||[]).forEach(l=>{if(l.side==='K'&&isDebtAcc(l.acc)){amt+=+l.amt||0;if(!acc)acc=l.acc}})}
    else if(isDebtAcc(j.creditAcc)){acc=j.creditAcc;amt=+j.amount||0}
    const paid=+j.debtPaid||0;
    if(acc&&amt>0&&amt-paid>0)out.push({src:'j',id:j.id,acc,amt,paid,rest:amt-paid,desc:j.desc||'',due:j.debtDue});
  });
  S.assets.forEach(a=>{if(a.debtRem&&!a.debtDone&&a.debtDue&&isDebtAcc(a.creditAcc)&&(+a.cost||0)>0&&(+a.cost||0)-(+a.debtPaid||0)>0)out.push({src:'a',id:a.id,acc:a.creditAcc,amt:+a.cost||0,paid:+a.debtPaid||0,rest:(+a.cost||0)-(+a.debtPaid||0),desc:a.name||'',due:a.debtDue})});
  const T0=new Date(today()+'T00:00:00').getTime();
  out.forEach(x=>{x.left=Math.round((new Date(x.due+'T00:00:00').getTime()-T0)/864e5)});
  return out.sort((a,b)=>a.left-b.left);
}

function buyOptions(name){
  if(name==='pKlas')return [{v:'Persediaan Barang',l:'Persediaan Barang'},{v:'Persediaan Bahan',l:'Persediaan Bahan'}];
  if(name==='pUnit')return unitList().map(u=>({v:u,l:u}));
  if(name==='pItem')return [...S.items].sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(i=>({v:i.id,l:i.name||'',sub:i.unit||''}));
  const A=S.accounts.filter(a=>!a.isHeader).sort((a,b)=>(a.ord||0)-(b.ord||0)),seen=new Set();
  const uniq=L=>L.filter(a=>!seen.has(a.code)&&seen.add(a.code)).map(a=>({v:a.code,l:a.name}));
  if(name==='pCredit'){
    if(!A.length)return COA.filter(a=>['kas','utang','modal'].includes(a.g)).map(a=>({v:a.c,l:a.n}));
    const kas=A.filter(a=>a.cat==='AL'&&/kas|bank|wallet|dompet|giro/i.test(a.name)),utang=A.filter(a=>a.cat==='KW'),
      md=A.filter(a=>a.cat==='MD'),mdS=md.filter(a=>/saldo awal|ekuitas/i.test(a.name));
    const L=[...kas,...utang,...(mdS.length?mdS:md)];
    return uniq(L.length?L:A.filter(a=>['AL','KW','MD'].includes(a.cat)));
  }
  if(name==='pInvAcc'){
    /* hanya akun neraca (aset); akun beban/pendapatan tidak boleh jadi akun persediaan. Akun persediaan di paling atas */
    if(!A.length)return COA.filter(a=>!['beban','bpp','akum','utang','modal'].includes(a.g)).map(a=>({v:a.c,l:a.n}));
    const ok=a=>{const k=bsClass(a);return !!k&&!k.contra&&k.g!=='utang'&&k.g!=='modal'};
    const isInv=a=>/persediaan|inventory/i.test(a.name),L=A.filter(ok);
    return uniq([...L.filter(isInv),...L.filter(a=>!isInv(a))]);
  }
  if(name==='pExpAcc'){
    /* hanya akun Beban Pokok Penjualan dan Beban Operasional */
    if(!A.length)return COA.filter(a=>a.g==='beban'||a.g==='bpp').map(a=>({v:a.c,l:a.n}));
    const isBpp=a=>plClass(a)==='hpp',isBo=a=>String(a.cat||'').toUpperCase()==='BO'||/beban operasional/i.test(a.catLabel||'')||(!bsClass(a)&&plClass(a)==='beban');
    return uniq([...A.filter(isBpp),...A.filter(a=>!isBpp(a)&&isBo(a))]);
  }
  return [];
}

/* Semua pencatatan (pembelian, biaya, aset, transaksi cepat, jurnal umum, amortisasi, penyusutan) dihimpun sebagai entri jurnal */
function jrnEntries(){
  const map=new Map(),add=(key,meta,e)=>{
    let x=map.get(key);if(!x){x={...meta,D:[],K:[]};map.set(key,x)}
    x[e.side].push({acc:e.code,amt:e.amt});
  };
  const src=j=>j.kind==='opname'?'Stock Opname':j.kind==='purchase'?'Pembelian':j.kind==='expense'?'Biaya':j.kind==='general'?'Jurnal Umum':'Transaksi Cepat';
  S.journals.forEach(j=>jEvents(j,today()).forEach(e=>{
    const amt=/-AMT$/.test(e.no||'');
    add((e.no||j.id)+'|'+e.date+'|'+(amt?'a':'b')+j.id,{no:e.no||'-',date:e.date,desc:e.desc||j.desc||'',source:amt?'Amortisasi':src(j),open:{k:'j',id:j.id},del:amt?null:j},e);
  }));
  const nos=assetNoInfo(S.assets).map,t0=d=>new Date(d+'T00:00:00').getTime(),cur=monthKey(new Date());
  S.assets.filter(a=>a.date&&a.cost>0).forEach(a=>{
    const no=hasAssetNo(a)?String(a.noAset).trim():(nos.get(a)||'');
    const m0={no:no||'-',date:a.date,desc:'Perolehan aset: '+(a.name||''),source:'Aset',open:{k:'a',id:a.id},del:null};
    add(a.id+'|acq',m0,{code:a.fixedAcc,side:'D',amt:a.cost});add(a.id+'|acq',m0,{code:a.creditAcc,side:'K',amt:a.cost});
    if(!a.nonDep&&a.usefulDays>0&&a.expAcc&&a.accumAcc){
      const base=Math.max(0,a.cost-(a.residual||0)),cum=d=>Math.min(base,base*Math.max(0,Math.floor((t0(d)-t0(a.date))/864e5))/a.usefulDays);
      let prev=0;
      for(let m=a.date.slice(0,7);m<=cur;m=addMonths(m,1)){
        const d=m===cur?today():jEom(m),c=cum(d),amt=c-prev;
        if(amt>0.5){const md={no:(no||'AST')+'-DEP',date:d,desc:'Penyusutan '+(a.name||''),source:'Penyusutan',open:{k:'a',id:a.id},del:null};
          add(a.id+'|dep|'+d,md,{code:a.expAcc,side:'D',amt});add(a.id+'|dep|'+d,md,{code:a.accumAcc,side:'K',amt})}
        prev=c;if(c>=base)break;

}

  closeSheet();commit([{t:'add',col:'journals',data:impJournal(x,jrnMaxNo()+1,Date.now(),p.impId?{impId:p.impId,impFile:p.src||''}:null)},{t:'del',col:'imports',id:p.id}]);
  toast('Jurnal disimpan dari Pending');render(true);
}
function pendRetry(){
  const L=jrnPend(),map=impAccMap(),seen=impSeen(),t0=Date.now();let n=jrnMaxNo(),done=0,dup=0;const ops=[];
  L.forEach(p=>{
    const c=impCheck(p.date,p.dn,p.kn,p.amt,map,p.ket);if(!c.x)return;
    if(seen.has([c.x.date,c.x.dc,c.x.kc,c.x.amt,(c.x.ket||('Impor: '+c.x.dn+' / '+c.x.kn)).slice(0,120)].join('|'))){dup++;ops.push({t:'del',col:'imports',id:p.id});return}
    ops.push({t:'add',col:'journals',data:impJournal(c.x,++n,t0+done,p.impId?{impId:p.impId,impFile:p.src||''}:null)},{t:'del',col:'imports',id:p.id});done++;
  });
  if(!ops.length)return toast('Belum ada baris yang siap diproses. Perbaiki atau tambahkan akun di COA.');
  commit(ops);toast(nf.format(done)+' jurnal diproses'+(dup?', '+nf.format(dup)+' sudah ada dan dihapus dari Pending':'')+(L.length-done-dup?', '+nf.format(L.length-done-dup)+' masih Pending':''));render(true);
}

function buyCellSave(inp){
  if(inp.dataset.done)return;inp.dataset.done='1';
  const j=S.journals.find(x=>x.id===inp.dataset.id),f=inp.dataset.f,v=inp.value.trim(),back=m=>{if(m)toast(m);refreshBuyList()};
  if(!j||inp.dataset.cancel)return back();
  let data,ops=[];const oq=+j.qty||0;
  if(f==='date'){
    const d=parseDmy(v);if(!d)return back('Isi tanggal dengan format dd/mm/yyyy');
    if(j.expiry&&j.expiry<d)return back('Tanggal pembelian tidak boleh setelah kadaluwarsa');
    if(d===j.date)return back();data={date:d};
  }else if(f==='item'){
    const it=S.items.find(i=>i.id===v);if(!it||it.id===j.itemId)return back();
    if(!it.invAcc)return back('Barang ini belum punya akun persediaan');
    if(j.creditAcc===it.invAcc)return back('Akun kredit tidak boleh sama dengan akun persediaan');
    data={itemId:it.id,itemName:it.name,debitAcc:it.invAcc};
    if(j.itemId&&oq&&S.items.some(i=>i.id===j.itemId))ops.push({t:'inc',col:'items',id:j.itemId,field:'qty',by:-oq});
    ops.push({t:'inc',col:'items',id:it.id,field:'qty',by:oq});
  }else if(f==='pay'){
    if(!v||v===j.creditAcc)return back();
    if(v===j.debitAcc)return back('Akun kredit tidak boleh sama dengan akun persediaan');
    data={creditAcc:v};
  }else if(f==='qty'){
    const q=parseFloat(v.replace(',','.'));if(!(q>0))return back('Qty harus lebih dari 0');
    if(q===oq)return back();data={qty:q};
    if(S.items.some(i=>i.id===j.itemId))ops.push({t:'inc',col:'items',id:j.itemId,field:'qty',by:q-oq});
  }else if(f==='amount'){
    const a=parseMoney(v);if(!(a>0))return back('Total harga harus lebih dari 0');
    if(a===j.amount)return back();data={amount:a};
  }else if(f==='exp'){
    if(!v){if(!j.expiry)return back();data={expiry:''}}
    else{
      const d=parseDmy(v);if(!d)return back('Isi kadaluwarsa dengan format dd/mm/yyyy');
      if(d<j.date)return back('Kadaluwarsa tidak boleh sebelum tanggal pembelian');
      if(d===j.expiry)return back();data={expiry:d};
    }
  }else{
    const d=v||('Pembelian '+(j.itemName||''));if(d===j.desc)return back();data={desc:d};
  }
  Object.assign(j,data);
  if(['date','item','qty','amount'].includes(f))ops.push(...buyCostOps(j));
  commit([{t:'set',col:'journals',id:j.id,data},...ops]);back('Pembelian diperbarui');
}

/* ---------- Buku besar akun (pop up dari Neraca) ---------- */
function bsLedgerData(code,month){
  const acc=S.accounts.find(a=>a.code===code&&!a.isHeader);
  const dayMs=864e5,t0=s=>new Date(s+'T00:00:00').getTime(),cur=monthKey(new Date());
  const eom=m=>iso(new Date(+m.slice(0,4),+m.slice(5,7),0));
  const nos=assetNoInfo(S.assets).map,noOf=a=>hasAssetNo(a)?String(a.noAset).trim():(nos.get(a)||'');
  const isLR=code==='LR';
  const cg=(COA.find(c=>c.c===code)||{}).g;
  let k=acc?bsClass(acc):null;
  if(!k&&!isLR){
    if(S.assets.some(a=>a.accumAcc===code))k={g:'tetap',contra:true};
    else if(S.assets.some(a=>a.fixedAcc===code))k={g:'tetap'};
    else k={g:cg==='utang'?'utang':cg==='modal'?'modal':'lancar'};
  }
  const normal=isLR||(k&&(k.contra||k.g==='utang'||k.g==='modal'))?'K':'D',contra=!!(k&&k.contra);
  const name=isLR?'Laba (rugi) berjalan':acc?acc.name:coaNameOnly(code);
  const ev=[];
  S.assets.filter(a=>a.date&&a.cost>0).forEach(a=>{
    const no=noOf(a);
    if(a.fixedAcc===code)ev.push({date:a.date,no,desc:'Perolehan aset: '+a.name,side:'D',amt:a.cost});
    if(a.creditAcc===code)ev.push({date:a.date,no,desc:'Pembayaran perolehan aset: '+a.name,side:'K',amt:a.cost});
    if((a.accumAcc===code||isLR)&&!a.nonDep&&a.usefulDays>0){
      const base=Math.max(0,a.cost-(a.residual||0)),
        cum=d=>Math.min(base,base*Math.max(0,Math.floor((t0(d)-t0(a.date))/dayMs))/a.usefulDays);
      let m=a.date.slice(0,7),prev=0;
      for(;m<=cur;m=addMonths(m,1)){
        const d=m===cur?today():eom(m),c=cum(d),amt=c-prev;
        if(amt>0.5)ev.push({date:d,no:no?no+'-DEP':'DEP',desc:'Penyusutan '+a.name,side:isLR?'D':'K',amt});
        prev=c;if(c>=base)break;
      }
    }
  });
  const isBS=c=>{const a=S.accounts.find(x=>!x.isHeader&&x.code===c);return !!(a&&bsClass(a))};
  S.journals.forEach(j=>jEvents(j,today()).forEach(e=>{
    if(e.code===code)ev.push({date:e.date,no:e.no,desc:e.desc,side:e.side,amt:e.amt});
    else if(isLR&&S.accounts.some(x=>!x.isHeader&&x.code===e.code)&&!isBS(e.code))ev.push({date:e.date,no:e.no,desc:e.desc,side:e.side,amt:e.amt});
  }));
  ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const sgn=e=>e.side===normal?1:-1;
  let nat=isLR||!acc?0:(contra?Math.abs(acc.saldo||0):(acc.saldo||0));
  const start=month+'-01',end=month+'-31';
  ev.filter(e=>e.date<start).forEach(e=>{nat+=sgn(e)*e.amt});
  const shown=v=>contra?-v:v,rows=[{open:true,bal:shown(nat)}];
  ev.filter(e=>e.date>=start&&e.date<=end).forEach(e=>{nat+=sgn(e)*e.amt;rows.push({...e,bal:shown(nat)})});
  const minM=ev.length?ev[0].date.slice(0,7):cur;
  return{code,name,rows,month,minM:minM<cur?minM:cur,maxM:cur};
}

const ordKey=k=>String(k).replace(/[^A-Za-z0-9|_-]/g,'_');
function ordBy(key,arr,idFn){const o=(S.cfg&&S.cfg.rowOrder&&S.cfg.rowOrder[ordKey(key)])||[];if(!o.length)return arr;const pos=new Map(o.map((x,i)=>[x,i])),p=x=>pos.has(idFn(x))?pos.get(idFn(x)):1e9;return [...arr].sort((a,b)=>p(a)-p(b))}
const ordWrap=(key,id,inner)=>`<div class="ord-node${S.ordOn===ordKey(key)+'/'+id?' ord-on':''}" data-ord="${esc(id)}" data-ordk="${esc(ordKey(key))}">${inner}</div>`;

/* ---------- Unduh Neraca (PDF) ----------
   Format: kop usaha (logo + nama usaha + judul), tabel Aset lalu Liabilitas dan Modal dengan kolom tanggal & % Aset.
   Pustaka jsPDF dimuat sekali saja saat tombol Unduh PDF pertama kali dipakai (perlu internet). */
const JSPDF_URLS=['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'];
function loadJsPdf(){
  if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve(window.jspdf.jsPDF);
  if(loadJsPdf.p)return loadJsPdf.p;
  const one=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.async=true;
    s.onload=()=>window.jspdf&&window.jspdf.jsPDF?ok(window.jspdf.jsPDF):no(new Error('jsPDF tidak tersedia'));
    s.onerror=()=>{s.remove();no(new Error('gagal memuat '+u))};document.head.appendChild(s)});
  loadJsPdf.p=one(JSPDF_URLS[0]).catch(()=>one(JSPDF_URLS[1])).catch(e=>{loadJsPdf.p=null;throw e});
  return loadJsPdf.p;
}
const dmy2=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(2,4);
function bsPdfLogo(url){

    if(!url||!/^data:image\/(png|jpe?g)/i.test(url))return res(null);
    const im=new Image();im.onload=()=>res({data:url,fmt:/^data:image\/png/i.test(url)?'PNG':'JPEG',w:im.naturalWidth||1,h:im.naturalHeight||1});
    im.onerror=()=>res(null);im.src=url;

/* Susunan baris laporan (mengikuti urutan & isi neraca di layar) */
function bsPdfOps(r,rPrev){
  const ops=[],nm=a=>a.name,isLR=n=>!n.hdr&&n.rows[0]&&n.rows[0].acc.code==='LR';
  const isContra=a=>{const k=bsClass(a);return !!(k&&k.contra)};
  const emit=(pref,gk,nodes,abs)=>{
    const v=x=>abs?Math.abs(x):x;
    ordBy(pref+'|'+gk,nodes,n=>n.hdr?'h'+n.hdr.id:'a'+n.rows[0].acc.code).forEach(n=>{
      if(!n.hdr){const q=n.rows[0];ops.push({t:'single',text:nm(q.acc),v:v(q.v)});return}
      ops.push({t:'hdr',text:nm(n.hdr),v:v(n.total)});
      ordBy(pref+'|'+gk+'|'+n.hdr.id,n.rows,q=>'a'+q.acc.code).forEach(q=>ops.push({t:'child',text:nm(q.acc),v:v(q.v)}));
    });
  };
  const split=nodes=>{
    const A=[],B=[];
    nodes.forEach(n=>{
      if(!n.hdr){(isContra(n.rows[0].acc)?B:A).push(n);return}
      const ra=n.rows.filter(q=>!isContra(q.acc)),rb=n.rows.filter(q=>isContra(q.acc));
      if(ra.length)A.push({hdr:n.hdr,rows:ra,total:sum(ra,q=>q.v)});
      if(rb.length)B.push({hdr:n.hdr,rows:rb,total:sum(rb,q=>q.v)});
    });
    return[A,B];
  };
  ops.push({t:'title',text:'Aset'});
  BS_ASET.forEach(g=>{

/* Gambar PDF A4: m = {title, sub, col2 (teks kolom tanggal/periode), col3 (array judul kolom %), total (dasar %), blankPct, logo, pos, ops} */
function pdfBuild(JsPDF,m){

  fnt(1,15);const w2=doc.getTextWidth(m.title);fnt(0,9);const w3=doc.getTextWidth(m.sub);
  fnt(1,11);const biz=clip(m.biz,R-L-2*off);

  fnt(1,11);doc.setTextColor(60,50,40);doc.text(biz,tx,26,{align:'center'});
  fnt(1,15);doc.setTextColor(20);doc.text(m.title,tx,44,{align:'center'});
  fnt(0,9);doc.setTextColor(90,80,70);doc.text(m.sub,tx,58,{align:'center'});
  doc.setDrawColor(209,199,191);doc.setLineWidth(.2);doc.line(L,64,R,64);
  y=m.noBar?72:78;if(!m.noBar)bar();
  const ops=m.ops,hh=i=>(ops[i]?H[ops[i].t]:0);
  ops.forEach((o,i)=>{
    const h=H[o.t],keep=o.t==='title'?hh(i+1)+hh(i+2)+hh(i+3):o.t==='label'?hh(i+1)+hh(i+2):(o.t==='hdr'||o.t==='hdr2'||o.t==='subhead')?hh(i+1):0;
    if(y+h+keep>BOT){doc.addPage();y=TOP;if(!m.noBar)bar()}
    const hasBg=o.t==='label'||o.t==='hdr'||o.t==='sub'||o.t==='grand'||o.t==='psub'||o.t==='pgrand';
    if(hasBg){doc.setFillColor(o.t==='grand'?209:232);doc.rect(L,y,R-L,h,'F')}
    if(o.t==='pplain'||o.t==='pcap'||o.t==='psub'||o.t==='pgrand'){
      const cap=o.t==='pcap',bd=o.t==='psub'||o.t==='pgrand';
      fnt(bd,o.t==='pgrand'?9.4:8.6);if(cap)fnt(0,7.5);doc.setTextColor(cap?140:o.t==='pgrand'?15:30);
      const ty=y+h/2+3;

    }
    if(o.t==='title'){fnt(1,10.5);doc.setTextColor(10);doc.text(o.text,40,y+12.125);y+=h;return}
    let x=40,by=y+10.51,bold=1,sz=8.6,col=30,amt=o.v!==undefined,semi=0;
    if(o.t==='hdr')x=54;

}

/* ---------- Laba Rugi (periode: hari ini s.d. custom) ---------- */
const PL_PERIODS=[['today','Hari ini'],['yesterday','Kemarin'],['week','Minggu ini'],['month','Bulan ini'],['lastmonth','Bulan lalu'],['year','Tahun ini'],['lastyear','Tahun lalu'],['custom','Custom']];
function plRange(){
  const m=S.pl.mode,n=new Date(),T=today(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),y=n.getFullYear();
  const sh=k=>iso(new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+k));
  if(m==='yesterday'){const d=sh(-1);return[d,d]}
  if(m==='week')return[sh(-((d0.getDay()+6)%7)),T];
  if(m==='month')return[iso(new Date(y,n.getMonth(),1)),T];
  if(m==='lastmonth')return[iso(new Date(y,n.getMonth()-1,1)),iso(new Date(y,n.getMonth(),0))];
  if(m==='year')return[y+'-01-01',T];
  if(m==='lastyear')return[(y-1)+'-01-01',(y-1)+'-12-31'];
  if(m==='custom'){const f=S.pl.from||iso(new Date(y,n.getMonth(),1)),t=S.pl.to||T;return f>t?[t,f]:[f,t]}
  return[T,T];
}
/* Kelompok laba rugi untuk akun non-neraca */
function plClass(a){
  const cat=String(a.cat||'').toUpperCase(),lab=String(a.catLabel||'').toLowerCase(),nm=String(a.name||'').toLowerCase(),t=nm+' '+lab;
  if(/hpp|harga pokok|beban pokok|\bbpp\b/.test(t))return 'hpp';
  /* penempatan mengikuti kategori akun di COA: kategori Beban Lain (BL) / Pendapatan Lain (PL) selalu masuk kelompok "lain", apa pun nama akunnya */
  if(cat==='BL'||/^(beban|biaya)\s+lain/.test(lab))return 'bebanLain';
  if(cat==='PL'||/^pendapatan\s+lain/.test(lab))return 'pendLain';
  if(cat==='BO'||/^(beban|biaya)/.test(nm)||/^(beban|biaya)/.test(lab))return /lain|bunga|selisih/.test(nm)?'bebanLain':'beban';
  /* akun berkategori pendapatan (PD) selalu masuk kelompok Pendapatan utama (paling atas), walau namanya memuat "lain" */
  if(cat==='PD'||(/^pendapatan/.test(lab)&&!/lain/.test(lab)))return 'pendapatan';
  if(/pendapatan|penjualan|revenue|omzet|jasa/.test(t))return /lain|bunga|selisih/.test(nm)?'pendLain':'pendapatan';
  return 'x';
}
/* Laba rugi periode [from,to] = saldo kumulatif s.d. 'to' dikurangi saldo kumulatif s.d. sehari sebelum 'from' (sama dengan dasar perhitungan neraca) */
function plCalc(from,to){
  const prev=iso(new Date(+from.slice(0,4),+from.slice(5,7)-1,+from.slice(8,10)-1));
  const byCode=new Map(),gcat={kas:'AL',utang:'KW',modal:'MD',aset:'AT',akum:'KAT',beban:'BO',bpp:'BO'};
  S.accounts.forEach(a=>{if(!a.isHeader)byCode.set(a.code,a)});
  const acc=c=>{let a=byCode.get(c);if(!a){const x=COA.find(k=>k.c===c);if(x){a={code:c,name:x.n,cat:gcat[x.g]||'',catLabel:''};byCode.set(c,a)}}return a};
  const cum=D=>{const m=new Map();S.journals.forEach(j=>jEvents(j,D).forEach(e=>{const a=acc(e.code);if(!a||bsClass(a))return;m.set(e.code,(m.get(e.code)||0)+(e.side==='K'?e.amt:-e.amt))}));return m};
  const A=cum(to),B=cum(prev),net=new Map();
  new Set([...A.keys(),...B.keys()]).forEach(c=>net.set(c,(A.get(c)||0)-(B.get(c)||0)));
  const G={pendapatan:[],hpp:[],beban:[],pendLain:[],bebanLain:[]};
  net.forEach((v,c)=>{
    if(Math.abs(v)<0.5)return;const a=acc(c);let g=plClass(a);if(g==='x')g=v>=0?'pendapatan':'beban';
    G[g].push({code:c,name:a.name,v:(g==='pendapatan'||g==='pendLain')?v:-v});
  });
  /* penyusutan aset tetap pada periode (garis lurus per hari, sama dengan neraca) */
  const t0=s=>new Date(s+'T00:00:00').getTime(),dep={};
  S.assets.forEach(x=>{
    if(!x.date||!(x.cost>0)||x.nonDep||!(x.usefulDays>0))return;
    const base=Math.max(0,x.cost-(x.residual||0)),f=D=>x.date>D?0:Math.min(base,base*Math.max(0,Math.floor((t0(D)-t0(x.date))/864e5))/x.usefulDays),d=f(to)-f(prev);
    if(d>0.5){const k=x.expAcc||'';dep[k]=(dep[k]||0)+d}
  });
  Object.entries(dep).forEach(([k,v])=>{
    const ex=k&&G.beban.find(r=>r.code===k);
    if(ex)ex.v+=v;else G.beban.push({code:k,name:k?coaNameOnly(k):'Beban penyusutan aset',v});
  });
  Object.values(G).forEach(l=>l.sort((a,b)=>String(a.code).localeCompare(String(b.code),'id',{numeric:true})));
  /* susunan header / sub-header mengikuti COA (sama seperti neraca) */
  const ent=new Map(),N={pendapatan:[],hpp:[],beban:[],pendLain:[],bebanLain:[]},used=new Set();
  Object.entries(G).forEach(([g,l])=>l.forEach(row=>ent.set(row.code||'__dep',{g,row})));
  for(const c of coaTree(S.accounts))for(const t of c.tops){
    const a=t.acc;
    if(a.isHeader&&t.subs.length){
      const by={};
      t.subs.forEach(s=>{const e=ent.get(s.code);if(e&&!used.has(s.code)){used.add(s.code);(by[e.g]=by[e.g]||[]).push({acc:s,v:e.row.v})}});
      for(const g in by)N[g].push({hdr:a,rows:by[g],total:sum(by[g],r=>r.v)});
      continue;
    }
    const e=!a.isHeader&&ent.get(a.code);
    if(e&&!used.has(a.code)){used.add(a.code);N[e.g].push({hdr:null,rows:[{acc:a,v:e.row.v}],total:e.row.v})}
  }
  ent.forEach((e,k)=>{if(!used.has(k))N[e.g].push({hdr:null,rows:[{acc:{code:e.row.code,name:e.row.name},v:e.row.v}],total:e.row.v})});
  const T=k=>sum(G[k],r=>r.v),pend=T('pendapatan'),hpp=T('hpp'),beban=T('beban'),pl=T('pendLain'),bl=T('bebanLain'),kotor=pend-hpp,ops=kotor-beban;
  return{from,to,G,N,pend,hpp,kotor,beban,ops,pl,bl,bersih:ops+pl-bl};
}

/* Baris laba rugi berhierarki (header dapat dilipat, akun dapat diklik untuk rincian) */
function plRows(nodes,gk,tot){

  }).join('');
}
/* Rincian transaksi satu akun laba rugi pada periode terpilih */
function plLedgerData(code,from,to){
  const dayBefore=s=>iso(new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)-1)),prev=dayBefore(from);
  const eom=m=>iso(new Date(+m.slice(0,4),+m.slice(5,7),0)),t0=s=>new Date(s+'T00:00:00').getTime();
  const acc=S.accounts.find(a=>a.code===code&&!a.isHeader),cm=COA.find(c=>c.c===code);
  const pseudo=acc||(cm?{code,name:cm.n,cat:({beban:'BO',bpp:'BO'})[cm.g]||'',catLabel:''}:{code,name:code,cat:'',catLabel:''});
  const nos=assetNoInfo(S.assets).map,noOf=a=>hasAssetNo(a)?String(a.noAset).trim():(nos.get(a)||'');
  const ev=[];
  S.journals.forEach(j=>{
    const et=jEvents(j,to).filter(e=>e.code===code&&e.date>=from);if(!et.length)return;
    const ep=jEvents(j,prev);
    et.forEach(e=>{
      let amt=e.amt;
      if(/-AMT$/.test(e.no||'')&&e.date.slice(0,7)===prev.slice(0,7)){const pe=ep.find(x=>x.no===e.no&&x.code===e.code&&x.side===e.side&&x.date===prev);if(pe)amt-=pe.amt}
      if(amt>0.5)ev.push({date:e.date,no:e.no,desc:e.desc,side:e.side,amt});
    });
  });
  S.assets.forEach(a=>{
    if(a.expAcc!==code||!a.date||!(a.cost>0)||a.nonDep||!(a.usefulDays>0))return;
    const base=Math.max(0,a.cost-(a.residual||0)),f=D=>a.date>D?0:Math.min(base,base*Math.max(0,Math.floor((t0(D)-t0(a.date))/864e5))/a.usefulDays),no=noOf(a);
    for(let m=from.slice(0,7);m<=to.slice(0,7);m=addMonths(m,1)){
      const s=(m+'-01')>from?m+'-01':from,e2=eom(m)<to?eom(m):to,amt=f(e2)-f(dayBefore(s));
      if(amt>0.5)ev.push({date:e2,no:no?no+'-DEP':'DEP',desc:'Penyusutan '+(a.name||''),side:'D',amt});
    }

const PLC_TYPES=[['day','Harian',31,7],['week','Mingguan',26,8],['month','Bulanan',24,3],['year','Tahunan',10,5]];

/* n periode terakhir (yang terbaru berakhir di periode berjalan, dihitung s.d. hari ini) */
function plcPeriods(type,n){
  const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),T=today(),out=[],cap=x=>x>T?T:x;
  for(let i=n-1;i>=0;i--){

    if(type==='day'){from=to=iso(new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()-i));lb=dmy(from).slice(0,5);full=dmy(from)}
    else if(type==='week'){const mon=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()-((d0.getDay()+6)%7)-7*i);from=iso(mon);to=cap(iso(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6)));lb=dmy(from).slice(0,5);full=dmy(from)+' – '+dmy(to)}

/* sumbu nilai dengan langkah "bulat": mengembalikan {mx,mn,st} */

  return `<path class="${cls}" d="M${x},${y0}H${x+w}V${y-r}Q${x+w},${y} ${x+w-r},${y}H${x+r}Q${x},${y} ${x},${y-r}Z"/>`;

/* satu grafik: series = [{k:'inc',cls:'cm-in'},…]; mode 'val' = beri warna positif/negatif dan label nilai */
function plcChart(rows,series,opt){
  opt=opt||{};
  const fs=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||1;
  const W=PLC_W||480,H=opt.h||190,L=Math.round(58*fs),R=6,T=14,B=Math.round(30*fs),ph=H-T-B,pw=W-L-R,n=rows.length;
  const ax=plcAxis(rows.flatMap(x=>series.map(q=>x[q.k]))),span=ax.mx-ax.mn;
  const Y=v=>T+ph-(v-ax.mn)/span*ph,y0=Y(0),cp=v=>v<0?'-'+compact(-v):compact(v);
  const sw=pw/n,k=series.length,gap=k>1?3:0,bw=Math.min(k>1?30:40,(sw*.72-gap*(k-1))/k),every=Math.max(1,Math.ceil(54*fs/sw));

  rows.forEach((x,i)=>{

    series.forEach((q,j)=>{
      const v=x[q.k],bx=cx-tw/2+j*(bw+gap),cls=opt.sign?(v<0?'cm-neg':'cm-pos'):q.cls;

    });

  });
  rows.forEach((x,i)=>{g+=`<rect x="${L+sw*i}" y="${T-6}" width="${sw}" height="${ph+12}" fill="transparent"><title>${esc(x.full)}\nPendapatan ${rp(x.inc)}\nBeban ${rp(x.out)}\nLaba (rugi) bersih ${rp(x.net)}</title></rect>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'Grafik perbandingan periode')}" class="chart plc-chart">${g}</svg>`;
}

const GL_PERIODS=[['today','Hari ini'],['month','Bulan ini'],['lastmonth','Bulan lalu'],['custom','Custom']];
function glRange(){
  const m=S.gl.mode,n=new Date(),T=today(),y=n.getFullYear();
  if(m==='month')return[iso(new Date(y,n.getMonth(),1)),T];
  if(m==='lastmonth')return[iso(new Date(y,n.getMonth()-1,1)),iso(new Date(y,n.getMonth(),0))];
  if(m==='custom'){const f=S.gl.from||iso(new Date(y,n.getMonth(),1)),t=S.gl.to||T;return f>t?[t,f]:[f,t]}
  return[T,T];
}
/* semua akun yang bisa dipilih: akun COA (bukan header) + akun yang dipakai jurnal/aset tetapi belum ada di COA */
function glAccounts(){
  const seen=new Map(),add=(c,n)=>{c=String(c||'').trim();if(c&&!seen.has(c))seen.set(c,n||coaNameOnly(c))};
  S.accounts.forEach(a=>{if(!a.isHeader)add(a.code,a.name)});
  S.journals.forEach(j=>{add(j.debitAcc);add(j.creditAcc);add(j.prepaidAcc);(j.lines||[]).forEach(l=>l&&add(l.acc))});
  S.assets.forEach(a=>{add(a.fixedAcc);add(a.creditAcc);add(a.accumAcc);add(a.expAcc)});
  return [...seen].map(([code,name])=>({code,name})).sort((a,b)=>String(a.code).localeCompare(String(b.code),'id',{numeric:true}));
}
/* Buku besar periode [from,to]. Akun neraca membawa saldo awal + mutasi sebelum 'from'; akun laba rugi dihitung per periode (sama dengan menu Laba Rugi). */
function glData(from,to){
  const t0=s=>new Date(s+'T00:00:00').getTime(),eom=m=>iso(new Date(+m.slice(0,4),+m.slice(5,7),0));
  const nos=assetNoInfo(S.assets).map,noOf=a=>hasAssetNo(a)?String(a.noAset).trim():(nos.get(a)||'');
  const ev=[];
  S.assets.forEach(a=>{
    if(!a.date||!(a.cost>0)||a.date>to)return;
    const no=noOf(a),nm=a.name||'';
    if(a.fixedAcc)ev.push({code:a.fixedAcc,date:a.date,no,desc:'Perolehan aset: '+nm,side:'D',amt:a.cost});
    if(a.creditAcc)ev.push({code:a.creditAcc,date:a.date,no,desc:'Pembayaran perolehan aset: '+nm,side:'K',amt:a.cost});
    if(a.nonDep||!(a.usefulDays>0))return;
    const base=Math.max(0,a.cost-(a.residual||0)),cum=d=>Math.min(base,base*Math.max(0,Math.floor((t0(d)-t0(a.date))/864e5))/a.usefulDays),lastM=to.slice(0,7);
    let prev=0;
    for(let m=a.date.slice(0,7);m<=lastM;m=addMonths(m,1)){
      const d=m===lastM?to:eom(m),c=cum(d),amt=c-prev;
      if(amt>0.5){
        const n2=no?no+'-DEP':'DEP';
        if(a.accumAcc)ev.push({code:a.accumAcc,date:d,no:n2,desc:'Penyusutan '+nm,side:'K',amt});
        if(a.expAcc)ev.push({code:a.expAcc,date:d,no:n2,desc:'Penyusutan '+nm,side:'D',amt});
      }
      prev=c;if(c>=base)break;
    }
  });
  S.journals.forEach(j=>jEvents(j,to).forEach(e=>ev.push(e)));
  const byCode=new Map(),gcat={kas:'AL',utang:'KW',modal:'MD',aset:'AT',akum:'KAT',beban:'BO',bpp:'BO'};
  S.accounts.forEach(a=>{if(!a.isHeader&&!byCode.has(a.code))byCode.set(a.code,a)});
  const accOf=c=>{const a=byCode.get(c);if(a)return a;const x=COA.find(k=>k.c===c);return x?{code:c,name:x.n,cat:gcat[x.g]||'',catLabel:'',virt:1}:{code:c,name:coaNameOnly(c),cat:'',catLabel:'',virt:1}};
  const byAcc=new Map();
  ev.forEach(e=>{if(!e.code)return;if(!byAcc.has(e.code))byAcc.set(e.code,[]);byAcc.get(e.code).push(e)});
  const out=[];
  glAccounts().forEach(({code})=>{
    const a=accOf(code),list=(byAcc.get(code)||[]).slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
    let k=bsClass(a);
    if(!k){if(S.assets.some(x=>x.accumAcc===code))k={g:'tetap',contra:true};else if(S.assets.some(x=>x.fixedAcc===code))k={g:'tetap'}}
    let normal,bal=0;
    if(k){
      normal=(k.contra||k.g==='utang'||k.g==='modal')?'K':'D';
      bal=a.virt?0:(k.contra?Math.abs(a.saldo||0):(a.saldo||0));
    }else{
      let g=plClass(a);
      if(g==='x'){const D=sum(list.filter(e=>e.side==='D'),e=>e.amt),K=sum(list.filter(e=>e.side==='K'),e=>e.amt);g=K-D>=0?'pendapatan':'beban'}
      normal=(g==='pendapatan'||g==='pendLain')?'K':'D';
    }
    const sg=e=>e.side===normal?1:-1;
    if(k)list.filter(e=>e.date<from).forEach(e=>{bal+=sg(e)*e.amt});
    const open=bal;
    const rows=list.filter(e=>e.date>=from&&e.date<=to).map(e=>{bal+=sg(e)*e.amt;return{...e,bal}});
    out.push({code,name:a.name||coaNameOnly(code),normal,bs:!!k,open,rows,close:bal});
  });
  return out;
}
const glNo=no=>!no?'-':/^AST/i.test(no)?`<button type="button" class="link no-link" data-act="bs-goasset" data-no="${esc(no.replace(/-DEP$/,''))}" title="Ubah aset">${esc(no)}</button>`:/^TRX/i.test(no)?`<button type="button" class="link no-link" data-act="bs-gojournal" data-no="${esc(no.replace(/-AMT$/,''))}" title="Ubah transaksi">${esc(no)}</button>`:esc(no);
function glVisible(from,to){
  const q=normTxt(S.gl.q),qd=String(S.gl.q||'').replace(/[.,\s]/g,''),numQ=/^\d+$/.test(qd)?qd:'';
  let data=glData(from,to);

  const out=[];
  data.forEach(x=>{

    if(!(S.gl.acc||rows.length||(Math.abs(x.open)>=0.5&&(!q||accHit))))return;
    out.push({x,rows});

/* Arus kas periode [from,to], metode langsung: setiap transaksi yang menyentuh akun kas/bank/e-wallet dikelompokkan menurut akun lawannya. */
function cfCalc(from,to){
  const gcat={kas:'AL',utang:'KW',modal:'MD',aset:'AT',akum:'KAT',beban:'BO',bpp:'BO'},byCode=new Map();
  S.accounts.forEach(a=>{if(!a.isHeader&&!byCode.has(a.code))byCode.set(a.code,a)});
  const accOf=c=>{const a=byCode.get(c);if(a)return a;const x=COA.find(k=>k.c===c);return x?{code:c,name:x.n,cat:gcat[x.g]||'',catLabel:'',virt:1}:{code:c,name:coaNameOnly(c),cat:'',catLabel:'',virt:1}};

  S.assets.forEach(a=>{if(a.date&&a.cost>0&&a.date<=to&&a.fixedAcc&&a.creditAcc)ent.push({date:a.date,lines:[{code:a.fixedAcc,side:'D',amt:a.cost,date:a.date,desc:a.name||''},{code:a.creditAcc,side:'K',amt:a.cost,date:a.date,desc:a.name||''}]})});

function pmCalc(from,to){
  const d0=new Date(from+'T00:00:00');d0.setDate(d0.getDate()-1);
  const rO=bsCalc(iso(d0)),rC=bsCalc(to);
  const isRE=q=>q.acc.code==='LR'||/laba ditahan|saldo laba|retained/i.test(q.acc.name||'');
  const split=r=>{let re=0,pd=0;r.groups.modal.nodes.forEach(n=>n.rows.forEach(q=>{if(isRE(q))re+=q.v;else pd+=q.v}));return{re,pd,tot:re+pd}};
  const o=split(rO),c=split(rC);
  const byCode=new Map();S.accounts.forEach(a=>{if(!a.isHeader&&!byCode.has(a.code))byCode.set(a.code,a)});
  const modalAcc=code=>{const a=byCode.get(code);if(a){const k=bsClass(a);return k&&k.g==='modal'?a:null}const x=COA.find(k=>k.c===code);return x&&x.g==='modal'?{code,name:x.n}:null};
  let setor=0,tarik=0;
  const nre=a=>!/laba ditahan|saldo laba|retained/i.test(a.name||'');
  S.journals.forEach(j=>jEvents(j,to).forEach(e=>{
    const dt=e.date||j.date;if(!dt||dt<from||dt>to)return;
    const a=modalAcc(e.code);if(!a)return;
    if(e.side==='K'){if(nre(a))setor+=e.amt}else tarik+=e.amt;

  S.assets.forEach(x=>{if(x.date&&x.cost>0&&x.date>=from&&x.date<=to&&x.creditAcc){const a=modalAcc(x.creditAcc);if(a&&nre(a))setor+=x.cost}});

}

/* analisis rasio untuk halaman Penutup: tiap analisis berupa satu paragraf panjang */
function frAnalisis(f,t,biz){
  const fm=n=>(n<0?'-':'')+'Rp '+Math.abs(Math.round(n||0)).toLocaleString('id-ID');
  const pc=v=>v.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
  const kl=v=>v.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+' kali';
  const dd=d=>frLong(d);
  const pl=plCalc(f,t),bs=bsCalc(t),G=k=>((bs.groups[k]||{}).total)||0;
  const aset=bs.aset,hutang=bs.hutang,modal=bs.modal;
  const per='periode '+dd(f)+' sampai dengan '+dd(t);
  /* profitabilitas */
  let prof;
  if(!(pl.pend>0)){
    prof='Pada '+per+', '+biz+' belum mencatat pendapatan usaha sehingga margin laba kotor, margin laba usaha, dan margin laba bersih belum dapat dihitung secara bermakna. Beban pokok pendapatan tercatat sebesar '+fm(pl.hpp)+' dan beban operasional sebesar '+fm(pl.beban)+', sehingga periode ini menghasilkan '+(pl.bersih<0?'rugi':'laba')+' bersih sebesar '+fm(Math.abs(pl.bersih))+'. Kondisi ini menunjukkan bahwa aktivitas penjualan perlu segera ditingkatkan agar beban usaha yang timbul dapat tertutup oleh pendapatan pada periode-periode berikutnya.';
  }else{
    const mk=pl.kotor/pl.pend*100,mo=pl.ops/pl.pend*100,mb=pl.bersih/pl.pend*100;
    const roa=aset>0?pl.bersih/aset*100:null,roe=modal>0?pl.bersih/modal*100:null;
    let nilai;
    if(pl.bersih<0)nilai='Hasil bersih yang negatif menunjukkan bahwa usaha mengalami kerugian pada periode ini, sehingga struktur biaya, kebijakan harga jual, dan volume penjualan perlu dievaluasi secara menyeluruh agar kinerja dapat dipulihkan.';
    else if(pl.bersih===0)nilai='Hasil bersih yang berada pada titik impas menunjukkan bahwa seluruh pendapatan hanya cukup untuk menutup beban, sehingga masih terdapat ruang untuk meningkatkan efisiensi dan penjualan.';
    else if(mb>=20)nilai='Margin laba bersih pada tingkat ini tergolong sangat baik dan menunjukkan bahwa usaha mampu mengelola beban secara efisien sambil mempertahankan harga jual yang kompetitif.';
    else if(mb>=10)nilai='Margin laba bersih pada tingkat ini tergolong baik dan menunjukkan bahwa kegiatan usaha menghasilkan keuntungan yang sehat, meskipun pengendalian beban operasional tetap perlu dijaga.';
    else nilai='Meskipun usaha membukukan laba, margin laba bersih masih tergolong tipis sehingga efisiensi beban operasional dan kebijakan harga jual perlu dikaji agar keuntungan dapat ditingkatkan.';
    prof='Pada '+per+', '+biz+' membukukan pendapatan sebesar '+fm(pl.pend)+' dengan beban pokok pendapatan sebesar '+fm(pl.hpp)+', sehingga laba kotor yang diperoleh adalah '+fm(pl.kotor)+' atau setara dengan margin laba kotor sebesar '+pc(mk)+'. Setelah dikurangi beban operasional sebesar '+fm(pl.beban)+', laba usaha tercatat sebesar '+fm(pl.ops)+' dengan margin laba usaha sebesar '+pc(mo)+', dan setelah memperhitungkan pendapatan serta beban di luar usaha utama, '+(pl.bersih<0?'rugi':'laba')+' bersih periode ini adalah '+fm(Math.abs(pl.bersih))+' dengan margin laba bersih sebesar '+pc(mb)+'.'+((roa!==null||roe!==null)?' Dari sisi pengembalian, '+[roa!==null?'return on assets sebesar '+pc(roa):'',roe!==null?'return on equity sebesar '+pc(roe):''].filter(Boolean).join(' dan ')+' untuk periode laporan (belum disetahunkan)'+'.':'')+' '+nilai;
  }
  /* solvabilitas */
  let solv;
  if(!(aset>0)){
    solv='Per '+dd(t)+', total aset belum tercatat bernilai positif sehingga rasio solvabilitas belum dapat dihitung secara bermakna. Total hutang tercatat sebesar '+fm(hutang)+' dan total modal sebesar '+fm(modal)+'. Pencatatan aset dan sumber pendanaan usaha perlu dilengkapi agar struktur permodalan dapat dianalisis dengan lebih akurat pada laporan berikutnya.';
  }else{
    const dr=hutang/aset*100,er=modal/aset*100;
    let nilai;
    if(hutang<=0)nilai='Usaha tidak memiliki hutang pada tanggal pelaporan dan seluruh aset dibiayai dengan modal sendiri, sehingga risiko solvabilitas tergolong sangat rendah dan usaha masih memiliki ruang yang luas apabila di kemudian hari memerlukan pendanaan eksternal untuk pengembangan.';
    else if(modal<=0)nilai='Total modal yang bernilai nol atau negatif menunjukkan bahwa hutang telah melampaui aset yang dimiliki, sehingga risiko solvabilitas tergolong tinggi dan usaha perlu segera memperkuat modal serta menekan hutang agar kewajiban jangka panjang dapat dipenuhi.';
    else if(dr<=40)nilai='Rasio tersebut menunjukkan struktur permodalan yang sehat karena sebagian besar aset dibiayai oleh modal sendiri, sehingga ketergantungan terhadap pihak ketiga relatif rendah dan kemampuan usaha memenuhi seluruh kewajibannya tergolong kuat.';
    else if(dr<=60)nilai='Rasio tersebut menunjukkan struktur permodalan yang cukup seimbang antara hutang dan modal sendiri, namun proporsi hutang perlu dijaga dan tidak ditambah tanpa perhitungan kemampuan bayar yang matang.';
    else nilai='Rasio tersebut menunjukkan bahwa pendanaan usaha lebih banyak bergantung pada hutang dibandingkan modal sendiri, sehingga risiko solvabilitas meningkat dan sebaiknya usaha memprioritaskan pelunasan hutang serta menahan penambahan kewajiban baru.';
    solv='Per '+dd(t)+', total aset '+biz+' tercatat sebesar '+fm(aset)+' yang dibiayai oleh hutang sebesar '+fm(hutang)+' dan modal sebesar '+fm(modal)+'. Rasio hutang terhadap aset berada pada angka '+pc(dr)+' dan rasio modal terhadap aset sebesar '+pc(er)+(modal>0?', sedangkan rasio hutang terhadap modal (debt to equity ratio) sebesar '+kl(hutang/modal):'')+'. '+nilai;
  }
  /* likuiditas */
  const kas=G('lancar'),piu=G('piutang'),per_=G('persediaan'),lain=G('lancarLain'),al=kas+piu+per_+lain;
  let lik;
  if(!(hutang>0)){
    lik='Per '+dd(t)+', aset lancar '+biz+' tercatat sebesar '+fm(al)+', terdiri atas kas, bank, dan e-wallet sebesar '+fm(kas)+', piutang sebesar '+fm(piu)+', persediaan sebesar '+fm(per_)+', serta aset lancar lainnya sebesar '+fm(lain)+'. Karena usaha tidak memiliki hutang yang harus dilunasi pada tanggal pelaporan, rasio lancar, rasio cepat, dan rasio kas tidak menunjukkan adanya tekanan likuiditas, sehingga kemampuan usaha memenuhi kewajiban jangka pendek tergolong sangat baik. Meskipun demikian, ketersediaan kas tetap perlu dipantau agar kebutuhan operasional harian dapat terus terpenuhi.';
  }else{
    const cr=al/hutang,qr=(kas+piu)/hutang,kr=kas/hutang;
    let nilai;
    if(cr>=2)nilai='Rasio lancar yang berada di atas dua kali menunjukkan likuiditas yang sangat baik karena aset lancar mampu menutup kewajiban dengan margin pengaman yang cukup besar, namun dana yang menganggur sebaiknya dimanfaatkan secara produktif.';
    else if(cr>=1)nilai='Rasio lancar yang berada di atas satu kali menunjukkan likuiditas yang memadai karena aset lancar masih mampu menutup seluruh kewajiban, meskipun margin pengamannya perlu dijaga melalui pengelolaan kas, penagihan piutang, dan jadwal pembayaran hutang yang disiplin.';
    else nilai='Rasio lancar yang berada di bawah satu kali menunjukkan bahwa aset lancar belum mampu menutup seluruh kewajiban, sehingga usaha perlu mempercepat penagihan piutang, meningkatkan penerimaan kas, serta menegosiasikan jadwal pembayaran hutang agar tidak terjadi kesulitan arus kas.';
    lik='Per '+dd(t)+', aset lancar '+biz+' tercatat sebesar '+fm(al)+', terdiri atas kas, bank, dan e-wallet sebesar '+fm(kas)+', piutang sebesar '+fm(piu)+', persediaan sebesar '+fm(per_)+', serta aset lancar lainnya sebesar '+fm(lain)+', sedangkan seluruh hutang sebesar '+fm(hutang)+' diperlakukan sebagai kewajiban jangka pendek secara konservatif karena pencatatan tidak membedakan hutang jangka pendek dan jangka panjang. Berdasarkan angka tersebut, rasio lancar (current ratio) sebesar '+kl(cr)+', rasio cepat (quick ratio) sebesar '+kl(qr)+', dan rasio kas (cash ratio) sebesar '+kl(kr)+'. '+nilai;
  }
  return{prof,solv,lik};
}

function cvLogoCut(src){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      try{
        const w=im.naturalWidth,h=im.naturalHeight;if(!w||!h)return res(src);
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.drawImage(im,0,0);
        const id=x.getImageData(0,0,w,h),d=id.data,cnt=new Map();
        const add=i=>{if(d[i+3]<20)return;const k=(d[i]>>5)+','+(d[i+1]>>5)+','+(d[i+2]>>5),o=cnt.get(k)||{n:0,r:0,g:0,b:0};o.n++;o.r+=d[i];o.g+=d[i+1];o.b+=d[i+2];cnt.set(k,o)};
        for(let i=0;i<w;i++){add(i*4);add(((h-1)*w+i)*4)}
        for(let j=0;j<h;j++){add(j*w*4);add((j*w+w-1)*4)}
        const bgs=[...cnt.values()].sort((a,b)=>b.n-a.n).slice(0,3).filter(o=>o.n>=Math.max(3,2*(w+h)*.02)).map(o=>[o.r/o.n,o.g/o.n,o.b/o.n]);
        if(!bgs.length)return res(src);
        const T=48,dist=i=>{let m=1e9;for(const b of bgs){const dr=d[i]-b[0],dg=d[i+1]-b[1],db=d[i+2]-b[2],v=Math.sqrt(dr*dr+dg*dg+db*db);if(v<m)m=v}return m};
        const seen=new Uint8Array(w*h),st=[];
        const push=p=>{if(seen[p])return;const i=p*4;if(d[i+3]<20||dist(i)<=T){seen[p]=1;st.push(p)}};
        for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}
        for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
        while(st.length){const p=st.pop(),px=p%w,py=(p-px)/w;if(px>0)push(p-1);if(px<w-1)push(p+1);if(py>0)push(p-w);if(py<h-1)push(p+w)}
        for(let p=0;p<w*h;p++)if(seen[p])d[p*4+3]=0;
        for(let p=0;p<w*h;p++){
          if(seen[p])continue;const px=p%w,py=(p-px)/w;
          if((px>0&&seen[p-1])||(px<w-1&&seen[p+1])||(py>0&&seen[p-w])||(py<h-1&&seen[p+w])){const v=dist(p*4);if(v<T*1.8)d[p*4+3]=Math.round(255*Math.max(0,(v-T)/(T*.8)))}
        }
        x.putImageData(id,0,0);res(cv.toDataURL('image/png'));
      }catch(e){res(src)}
    };
    im.onerror=()=>res(src);im.src=src;
  });
}

const esScope=()=>((S.user&&S.user.uid)||'demo')+'|'+(S.wsId||'main');
function esDb(){
  if(esDb.p)return esDb.p;
  esDb.p=new Promise((ok,no)=>{
    if(!window.indexedDB)return no(new Error('IndexedDB tidak tersedia'));
    const r=indexedDB.open('essencount-estatement',1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('f'))r.result.createObjectStore('f',{keyPath:'k'})};
    r.onsuccess=()=>ok(r.result);
    r.onerror=()=>{esDb.p=null;no(r.error)};
  });
  return esDb.p;
}
const esRun=(mode,fn)=>esDb().then(db=>new Promise((ok,no)=>{
  const t=db.transaction('f',mode),st=t.objectStore('f');let out;
  fn(st,v=>{out=v});
  t.oncomplete=()=>ok(out);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error);
}));
/* kumpulkan berkas milik workspace ini (withData=false hanya metadata) */
function esScan(withData,pred){
  return esRun('readonly',(st,set)=>{
    const res=[],sc=esScope();
    st.openCursor().onsuccess=e=>{
      const c=e.target.result;
      if(!c){set(res);return}
      const v=c.value;
      if(v.scope===sc&&(!pred||pred(v))){
        res.push(withData?v:{k:v.k,ym:v.ym,id:v.id,name:v.name,size:v.size,t:v.t,kind:v.kind||'',th:v.th||''});
      }
      c.continue();
    };
  });
}
const esPut=rec=>esRun('readwrite',st=>{st.put(rec)});
const esDel=k=>esRun('readwrite',st=>{st.delete(k)});
const esFetch=(from,to)=>esScan(true,v=>v.kind!=='bukti'&&v.ym>=from&&v.ym<=to).then(l=>l.sort((a,b)=>a.ym<b.ym?-1:a.ym>b.ym?1:a.t-b.t));
function esSt(){
  const s=frState(),n=new Date();
  if(!s.esM)s.esM=n.getMonth()||12;      /* bulan sebelumnya */
  if(!s.esY)s.esY=n.getFullYear();       /* tahun saat ini */

}

const esSize=b=>b>=1048576?(b/1048576).toLocaleString('id-ID',{maximumFractionDigits:1})+' MB':Math.max(1,Math.round(b/1024))+' KB';
